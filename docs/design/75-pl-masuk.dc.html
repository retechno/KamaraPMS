<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Masuk operator platform</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1c2128;background:#f6f7f9}
a{color:#1f6f5c}a:hover{color:#164f42}
</style>
</helmet>
<main style="min-height: 800px; box-sizing: border-box; display: grid; place-items: center; padding: 32px 16px; background: #f6f7f9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1c2128">
  <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px">
    <div style="background: #ffffff; border: 1px solid #e3e6ea; border-radius: 12px; padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #1c2128; color: #3fa98d; display: grid; place-items: center; font-weight: 700">K</span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h1 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.2">Console platform</h1>
          <span style="font-size: 13px; color: #626b77">Khusus operator KamaraPMS</span>
        </div>
        <span style="margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff; background: #1c2128; padding: 3px 8px; border-radius: 999px">Platform</span>
      </div>

      <p role="alert" style="margin: 0; padding: 10px 14px; border: 1px solid #b4332c; border-radius: 8px; color: #b4332c; background: #f8eceb; font-size: 14px">Email atau password salah.</p>

      <form style="display: flex; flex-direction: column; gap: 14px; margin: 0">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="p-email" style="font-size: 14px; font-weight: 500">Email</label>
          <input id="p-email" name="email" type="email" autocomplete="username" value="rina@kamarapms.example" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e3e6ea; border-radius: 8px; font: inherit; font-size: 14px; color: #1c2128; background: #ffffff">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="p-password" style="font-size: 14px; font-weight: 500">Password</label>
          <div style="position: relative">
            <input id="p-password" name="password" type="password" autocomplete="current-password" value="••••••••••••" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 44px 0 12px; border: 1px solid #b4332c; border-radius: 8px; font: inherit; font-size: 14px; color: #1c2128; background: #ffffff" aria-invalid="true">
            <button type="button" aria-label="Tampilkan password" aria-pressed="false" style="position: absolute; right: 2px; top: 2px; width: 36px; height: 36px; border: 0; background: transparent; border-radius: 6px; color: #626b77; cursor: pointer; display: grid; place-items: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <button type="submit" style="height: 44px; border: 0; border-radius: 8px; background: #1f6f5c; color: #ffffff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Lanjut</button>
      </form>

      <p style="margin: 0; font-size: 13px; color: #626b77; line-height: 1.5">Langkah berikutnya meminta kode 6 digit dari aplikasi authenticator. Lupa password atau kehilangan perangkat? Operator lain mereset lewat <code style="font-size: 12px; background: #f6f7f9; padding: 1px 5px; border-radius: 4px">pms-admin</code>.</p>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #626b77; padding: 0 4px">
      <a href="#">Masuk sebagai staf hotel</a>
      <label style="display: flex; align-items: center; gap: 6px">Bahasa
        <select style="height: 32px; border: 1px solid #e3e6ea; border-radius: 6px; font: inherit; font-size: 13px; background: #ffffff; color: #1c2128">
          <option>Indonesia</option>
          <option>English</option>
        </select>
      </label>
    </div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
