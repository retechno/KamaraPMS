      properties:
        code: { type: string }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        meal_plan: { $ref: "#/components/schemas/MealPlan" }
        cancellation_policy: { type: string, maxLength: 2000 }
        is_refundable: { type: boolean, default: true }
        room_charge_code_id: { type: integer, format: int64 }
        is_active: { type: boolean, default: true }
    PatchRatePlanRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        meal_plan: { $ref: "#/components/schemas/MealPlan" }
        cancellation_policy: { type: string, maxLength: 2000 }
        is_refundable: { type: boolean }
        room_charge_code_id: { type: integer, format: int64 }
        is_active: { type: boolean }
    RateCell:
      type: object
      required: [room_type_id, stay_date, amount]
      properties:
        room_type_id: { type: integer, format: int64 }
        stay_date: { $ref: "#/components/schemas/Date" }
        amount: { type: string, description: Formatted with the currency's decimals. }
    RateGrid:
      type: object
      required: [rate_plan_id, price_mode, room_charge_code, from, to, rates]
      properties:
        rate_plan_id: { type: integer, format: int64 }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        room_charge_code: { type: string }
        from: { $ref: "#/components/schemas/Date" }
        to: { $ref: "#/components/schemas/Date" }
        rates:
          type: array
          items: { $ref: "#/components/schemas/RateCell" }
    Weekday:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
    FillRatesRequest:
      type: object
      required: [rate_plan_id, room_type_ids, from, to, amount]
      additionalProperties: false
