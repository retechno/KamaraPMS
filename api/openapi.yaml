    get:
      operationId: listCityLedgerAccounts
      summary: Companies with what they owe (cityledger.read)
      description: The balance is derived (transfers minus receipts), never stored.
      tags: [city-ledger]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: owing, in: query, description: Only companies with a balance above zero., schema: { type: boolean } }
        - { name: q, in: query, description: Matches the code or the name., schema: { type: string } }
      responses:
        "200":
          description: A page of accounts, by company id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerAccountPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}:
    parameters:
