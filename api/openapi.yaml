  /api/v1/properties/{propertyId}/reservations/{id}/rooms/{lineId}/no-show:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LineId"
    post:
      operationId: markReservationRoomNoShow
      summary: Mark a confirmed room as a no-show (nightaudit.no_show)
      description: |
        Only a CONFIRMED room whose arrival date has come (arrival on or before the business date). Releases its inventory.
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/rooms/{lineId}/assign-room:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LineId"
    post:
      operationId: assignReservationRoom
      summary: Assign a specific room (reservation.update)
      description: |
        A room of another type than the booked one is an upgrade: it needs `upgrade: true` and `reservation.upgrade`, and the room type of the room must have the inventory. The room must be free (409 `ROOM_NOT_AVAILABLE` with the reasons).
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignRoomRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/rooms/{lineId}/unassign-room:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LineId"
    post:
      operationId: unassignReservationRoom
      summary: Take the assigned room off (reservation.update)
      description: |
        The room goes back to consuming its booked room type, which must have the inventory when it was an upgrade.
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/tape-chart:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getTapeChart
      summary: Rooms with the bookings and blocks touching [from, to) (reservation.read)
      description: "Read-only. The window is at most 62 days. Rows are the active rooms; CONFIRMED and CHECKED_IN room lines without a specific room are listed per room type under `unassigned`."
      tags: [reservations]
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
      responses:
        "200":
          description: The chart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TapeChart" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listFolios
      summary: List folios with their balances (folio.read)
      tags: [folios]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: reservation_id, in: query, schema: { type: integer, format: int64 } }
        - { name: stay_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED] } }
      responses:
        "200":
          description: A page of folios.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolioPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getFolio
      summary: A folio with its ledger items and components (folio.read)
      description: "`balance` is debits minus credits; it is never stored. Amounts are formatted with the property's currency decimals."
      tags: [folios]
      responses:
        "200":
          description: The folio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folio" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}/charges:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postFolioCharge
      summary: Post a manual charge (folio.post_charge)
      description: |
        The breakdown comes only from the charge calculation engine. A charge code of type ROOM is refused (409 `ROOM_CHARGE_REQUIRES_ROOM_POSTING`). `unit_price` falls back to the charge code's default price. The folio must be OPEN. The same Idempotency-Key replays the stored item.
      tags: [folios]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostChargeRequest" }
      responses:
        "201":
          description: The item and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}/adjustments:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postFolioAdjustment
      summary: Post a signed adjustment on the current business date (folio.adjust, needs approval)
      description: |
        Needs the `approval` block (docs 06-api.md §14.1). The engine runs on a signed amount, so taxes and service charges follow the sign. A replay of the same Idempotency-Key returns the stored item and does not ask for approval again.
      tags: [folios]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostAdjustmentRequest" }
      responses:
        "201":
          description: The item and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}/payments:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postFolioPayment
      summary: Take a payment (payment.post)
      tags: [folios]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostPaymentRequest" }
      responses:
        "201":
          description: The payment, its ledger entry and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}/close:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: closeFolio
      summary: Close a folio with a zero balance (folio.post_charge)
      description: For folios that never got a stay. A folio linked to an OPEN stay closes with the check-out (409 `FOLIO_LINKED_TO_OPEN_STAY`). Every posting bumps the folio's version, so a stale screen gets 409 `VERSION_CONFLICT`.
      tags: [folios]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200":
          description: The closed folio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folio" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folio-items/{id}/reverse:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reverseFolioItem
      summary: Reverse an item posted on the current business date (folio.reverse, needs approval)
      description: |
        Debit and credit are swapped and every signed column and component is negated. A payment is voided instead (409 `USE_PAYMENT_CORRECTION`); an item of an earlier date is corrected with an adjustment (409 `CORRECTION_REQUIRES_ADJUSTMENT`); an item is reversed once (409 `ALREADY_REVERSED`).
      tags: [folios]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionRequest" }
      responses:
        "201":
          description: The reversal item and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/deposits:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postDeposit
      summary: Take a deposit on a draft or confirmed reservation (payment.post)
      description: The payment goes on the reservation's open folio that is not linked to a stay; the first deposit creates it.
      tags: [folios]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostPaymentRequest" }
      responses:
        "201":
          description: The payment, its ledger entry and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payments:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listPayments
      summary: The cashier list, newest first, with net totals per method for a business date (folio.read)
      description: "`totals` is only filled when `business_date` is given: paid, refunded and net per method, voided payments excluded."
      tags: [folios]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: business_date, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: method, in: query, schema: { $ref: "#/components/schemas/PaymentMethod" } }
      responses:
        "200":
          description: A page of payments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payments/{id}/void:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: voidPayment
      summary: Void a payment taken on the current business date (payment.void, needs approval)
      description: The payment becomes VOIDED and its ledger entry is reversed. Rejected for a payment with refunds, for a refund, and for an earlier date (refund it instead).
      tags: [folios]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionRequest" }
      responses:
        "200":
          description: The voided payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payments/{id}/refunds:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: refundPayment
      summary: Refund part or all of a payment (payment.refund, needs approval)
      description: The amount is checked against what is left of the payment under the payment's row lock (409 `REFUND_EXCEEDS_PAYMENT`, with `context.refundable`).
      tags: [folios]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
      responses:
        "201":
          description: The refund, its ledger entry and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/rooms/{lineId}/check-in:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LineId"
    post:
      operationId: checkIn
      summary: Check a confirmed room in (frontdesk.checkin)
      description: |
        The arrival date must be the business date (409 `ARRIVAL_DATE_MISMATCH`). `room_id` may be omitted when a room is assigned. The room must be free (409 `ROOM_OCCUPIED`, `ROOM_BLOCKED`, `ROOM_NOT_AVAILABLE`) and ready: CLEAN or INSPECTED, or INSPECTED only when the property requires an inspection (409 `ROOM_NOT_READY` with `context.current` and `context.required`). An override needs `frontdesk.checkin_unready_room` and a reason. A room of another type than the booked one is an upgrade (needs `reservation.upgrade` and the room type's inventory). The open deposit folio of the reservation is linked to the stay, otherwise a folio is created. The same Idempotency-Key returns the stay it created.
      tags: [frontdesk]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInRequest" }
      responses:
        "201":
          description: The stay, its first segment and its folio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckInResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/walk-ins:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: walkIn
      summary: Create, confirm, assign and check in a room in one transaction (frontdesk.checkin and reservation.create)
      description: Arrival is the business date and the source is WALK_IN. Give `guest_id` or `new_guest`. Any refusal (room not free, not ready, no rate) leaves nothing behind.
      tags: [frontdesk]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalkInRequest" }
      responses:
        "201":
          description: The reservation, the stay and the folio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckInResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/arrivals:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listArrivals
      summary: Confirmed rooms arriving on a date (reservation.read)
      description: "`date` defaults to the business date. A room that is checked in is no longer an arrival."
      tags: [frontdesk]
      parameters:
        - { name: date, in: query, schema: { $ref: "#/components/schemas/Date" } }
      responses:
        "200":
          description: The arrivals.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Arrival" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/stays:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listStays
      summary: "Stays, newest first (the in-house and due-out lists, reservation.read)"
      tags: [frontdesk]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CHECKED_OUT, CANCELLED] } }
        - { name: departure_date, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: departure_until, in: query, schema: { $ref: "#/components/schemas/Date" }, description: Stays leaving on or before this date (the departures list, with status OPEN). }
        - { name: room_id, in: query, schema: { type: integer, format: int64 }, description: The room of the open segment. }
      responses:
        "200":
          description: A page of stays.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StayPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/stays/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getStay
      summary: A stay with its segments, guests, room line, nightly rates and folio (reservation.read)
      description: "`nightly_rates[].posted` says whether the night has been charged (always false until room charges are posted)."
      tags: [frontdesk]
      responses:
        "200":
          description: The stay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StayDetail" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/stays/{id}/reverse-check-in:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reverseCheckIn
      summary: Undo a check-in of the same business date (frontdesk.reverse_checkin)
      description: The stay is cancelled, its segment closed, the room line goes back to CONFIRMED, the folio is unlinked and the room becomes DIRTY. Refused once a charge is posted to the folio (409 `CHECK_IN_HAS_CHARGES`) or on a later business day (409 `CHECK_IN_NOT_REVERSIBLE`).
      tags: [frontdesk]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseCheckInRequest" }
      responses:
        "200":
          description: The cancelled stay and the unlinked folio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReverseResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/stays/{id}/move:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: moveStay
      summary: Move an in-house stay to another room (frontdesk.room_move)
      description: "The current segment closes and a new one opens for the target room; the old room becomes DIRTY. The target must be free for the rest of the stay (409 `ROOM_OCCUPIED`, `ROOM_NOT_AVAILABLE`), have inventory if its type differs (409 `ROOM_TYPE_NOT_AVAILABLE`) and be clean (409 `ROOM_NOT_READY`, override needs `frontdesk.override_room_not_ready`). `new_nightly_rates` (needs `frontdesk.rate_change`) may reprice the nights not yet charged (409 `NIGHT_ALREADY_POSTED`)."
      tags: [frontdesk]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoveResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/stays/{id}/change-departure:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: changeStayDeparture
      summary: Extend or shorten an in-house stay (reservation.update)
      description: "Extending needs the room free for the extra nights (409 `ROOM_NOT_AVAILABLE_FOR_EXTENSION`, the context lists `alternative_rooms` and `suggest_room_move`) and inventory. Shortening needs a date after the business date and after the last charged night (409 `NIGHT_ALREADY_POSTED`). The reservation line keeps its own dates."
      tags: [frontdesk]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeDepartureRequest" }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stay" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/stays/{id}/guests:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addStayGuest
      summary: Add an accompanying guest (frontdesk.checkin)
      description: "409 `GUEST_ALREADY_ON_STAY` when the guest is already the main or an accompanying guest."
      tags: [frontdesk]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddStayGuestRequest" }
      responses:
        "201":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StayDetail" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/stays/{id}/check-out:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: checkOutStay
      summary: Check an in-house stay out (frontdesk.checkout)
      description: "Posts every unposted night up to the business date (trigger CHECK_OUT), requires every folio of the stay to have a zero balance (409 `FOLIO_NOT_BALANCED`, context `folios`), closes the folios and the segment, completes the room line and makes the room DIRTY (and VACANT, derived). Leaving before the booked departure needs `confirm_early_departure` (409 `EARLY_DEPARTURE_NOT_CONFIRMED`); the stay then ends at the business date, or the next day once the calendar date has passed it. A room charge that cannot be posted refuses the check-out (409 `REQUIRED_CHARGES_NOT_POSTED`). Everything happens in one transaction. The `Idempotency-Key` header is required; a retry with the same version of an already completed check-out returns its result."
      tags: [frontdesk]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckOutRequest" }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckOutResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/night-audit/room-charges/preview:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: previewRoomCharges
      summary: Preview the room charges that are due (nightaudit.run or folio.post_charge)
      description: |
        A dry run of the room charge posting: which nights of which stays are READY, already posted, not applicable or in ERROR, with the service charge, tax and total the engine calculates. It modifies nothing. `business_date` must be the open business date (409 `BUSINESS_DATE_MISMATCH`). Without `stay_ids` every in-house stay is considered.
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomChargeRequest" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomChargePreview" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/night-audit/room-charges:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: postRoomCharges
      summary: Post the room charges that are due (nightaudit.run or folio.post_charge)
      description: |
        Posts every READY night (earlier nights that were never posted and tonight's) through the folio posting service, in the order of stay and night, and records each in the posting register. The stays are locked first, so concurrent runs cannot charge a night twice; a second run answers `ALREADY_POSTED`. ERROR nights (no open folio, no nightly rate, no room for the night, an invalid charge code) are reported and never posted. `revalidation` re-reads the scope after the commit.
      tags: [billing]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomChargeRequest" }
      responses:
        "200":
          description: The results and the revalidation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomChargePostResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /api/v1/auth/login or /api/v1/auth/refresh (15 minutes).
  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor.
      schema: { type: string }
  responses:
    Problem:
      description: An error, described as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    LoginRequest:
      type: object
      required: [tenant_code, email, password]
      additionalProperties: false
      properties:
        tenant_code: { type: string }
        email: { type: string }
        password: { type: string }
    Session:
      type: object
      required: [access_token, token_type, expires_in, expires_at, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 12 }
    Grant:
      type: object
      required: [property_id, property_code, property_name, role_id, role_name]
      properties:
        property_id: { type: integer, format: int64 }
        property_code: { type: string }
        property_name: { type: string }
        role_id: { type: integer, format: int64 }
        role_name: { type: string }
    GrantInput:
      type: object
      required: [property_id, role_id]
      additionalProperties: false
      properties:
        property_id: { type: integer, format: int64 }
        role_id: { type: integer, format: int64 }
    User:
      type: object
      required: [id, email, full_name, is_tenant_admin, is_active, created_at, grants]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        full_name: { type: string }
        is_tenant_admin: { type: boolean }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
    UserPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: string }
    CreateUserRequest:
      type: object
      required: [email, full_name, password]
      additionalProperties: false
      properties:
        email: { type: string }
        full_name: { type: string }
        password: { type: string, minLength: 12 }
        is_tenant_admin: { type: boolean, default: false }
        grants:
          type: array
          items: { $ref: "#/components/schemas/GrantInput" }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        full_name: { type: string }
        is_active: { type: boolean }
        is_tenant_admin: { type: boolean }
    PermissionInfo:
      type: object
      required: [code, group, description, milestone]
      properties:
        code: { type: string }
        group: { type: string }
        description: { type: string }
        milestone: { type: string }
    Role:
      type: object
      required: [id, name, is_system, permissions, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
    Me:
      type: object
      required: [user, tenant, properties]
      properties:
        user: { $ref: "#/components/schemas/User" }
        tenant:
          type: object
          required: [id, code, name]
          properties:
            id: { type: integer, format: int64 }
            code: { type: string }
            name: { type: string }
        properties:
          type: array
          items:
            type: object
            required: [id, code, name, role, permissions]
            properties:
              id: { type: integer, format: int64 }
              code: { type: string }
              name: { type: string }
              role: { type: string }
              permissions:
                type: array
                items: { type: string }
    Date:
      type: string
      format: date
      description: Calendar/business date (YYYY-MM-DD), never shifted by time zones.
      examples: ["2026-09-30"]
    TimeOfDay:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples: ["14:00"]
    PropertySettings:
      type: object
      required: [name, timezone, currency_code, currency_decimals, check_in_time, check_out_time,
                 require_room_inspection_for_checkin, night_audit_marks_occupied_dirty, night_audit_earliest_time]
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        country_code: { type: string, description: ISO 3166-1 alpha-2 }
        timezone: { type: string, description: IANA time zone, examples: [Asia/Jakarta] }
        currency_code: { type: string, description: ISO 4217, examples: [IDR] }
        currency_decimals: { type: integer, minimum: 0, maximum: 3 }
        check_in_time: { $ref: "#/components/schemas/TimeOfDay" }
        check_out_time: { $ref: "#/components/schemas/TimeOfDay" }
        require_room_inspection_for_checkin: { type: boolean }
        night_audit_marks_occupied_dirty: { type: boolean }
        night_audit_earliest_time: { $ref: "#/components/schemas/TimeOfDay" }
    Property:
      allOf:
        - $ref: "#/components/schemas/PropertySettings"
        - type: object
          required: [id, code, status, created_at, updated_at]
          properties:
            id: { type: integer, format: int64 }
            code: { type: string }
            status: { type: string, enum: [ACTIVE, INACTIVE] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PropertyWithDay:
      allOf:
        - $ref: "#/components/schemas/Property"
        - type: object
          required: [business_date]
          properties:
            business_date: { $ref: "#/components/schemas/Date" }
    PropertyPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Property" }
        next_cursor: { type: string }
    CreatePropertyRequest:
      type: object
      required: [code, name, timezone, currency_code, currency_decimals, check_in_time, check_out_time, opening_business_date]
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        country_code: { type: string }
        timezone: { type: string }
        currency_code: { type: string }
        currency_decimals: { type: integer, minimum: 0, maximum: 3 }
        check_in_time: { $ref: "#/components/schemas/TimeOfDay" }
        check_out_time: { $ref: "#/components/schemas/TimeOfDay" }
        require_room_inspection_for_checkin: { type: boolean, default: false }
        night_audit_marks_occupied_dirty: { type: boolean, default: true }
        night_audit_earliest_time: { $ref: "#/components/schemas/TimeOfDay" }
        opening_business_date:
          $ref: "#/components/schemas/Date"
          description: The property's current local date or the day before.
    PatchPropertyRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        country_code: { type: string }
        timezone: { type: string }
        currency_code: { type: string }
        currency_decimals: { type: integer, minimum: 0, maximum: 3 }
        check_in_time: { $ref: "#/components/schemas/TimeOfDay" }
        check_out_time: { $ref: "#/components/schemas/TimeOfDay" }
        require_room_inspection_for_checkin: { type: boolean }
        night_audit_marks_occupied_dirty: { type: boolean }
        night_audit_earliest_time: { $ref: "#/components/schemas/TimeOfDay" }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    DayClock:
      type: object
      required: [business_date, server_time, property_local_time, timezone, night_audit_allowed, night_audit_allowed_from, night_audit_overdue]
      properties:
        business_date: { $ref: "#/components/schemas/Date" }
        server_time: { type: string, format: date-time, description: Server time (UTC) }
        property_local_time: { type: string, description: "Server time in the property time zone (RFC 3339 with offset)" }
        timezone: { type: string }
        night_audit_allowed: { type: boolean }
        night_audit_allowed_from: { type: string, format: date-time }
        night_audit_overdue: { type: boolean, description: The local date is more than one day past the business date. }
    BusinessDay:
      type: object
      required: [business_date, status, opened_at]
      properties:
        business_date: { $ref: "#/components/schemas/Date" }
        status: { type: string, enum: [OPEN, CLOSED] }
        opened_at: { type: string, format: date-time }
        opened_by: { type: integer, format: int64 }
        closed_at: { type: string, format: date-time }
        closed_by: { type: integer, format: int64 }
        summary: { type: object, additionalProperties: true }
    BusinessDayPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/BusinessDay" }
        next_cursor: { type: string }
    RoomType:
      type: object
      required: [id, code, name, max_adult, max_child, max_occupancy, base_occupancy, sort_order, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        max_adult: { type: integer }
        max_child: { type: integer }
        max_occupancy: { type: integer, description: At most max_adult + max_child. }
        base_occupancy: { type: integer, description: At most max_occupancy. }
        sort_order: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoomTypePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RoomType" }
        next_cursor: { type: string }
    CreateRoomTypeRequest:
      type: object
      required: [code, name, max_adult, max_child, max_occupancy, base_occupancy]
      additionalProperties: false
      properties:
        code: { type: string, description: "1-20 characters, A-Z 0-9 - _ (upper-cased)." }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        max_adult: { type: integer, minimum: 1, maximum: 20 }
        max_child: { type: integer, minimum: 0, maximum: 20 }
        max_occupancy: { type: integer, minimum: 1, maximum: 40 }
        base_occupancy: { type: integer, minimum: 1, maximum: 40 }
        sort_order: { type: integer }
        is_active: { type: boolean, default: true }
    PatchRoomTypeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        max_adult: { type: integer, minimum: 1, maximum: 20 }
        max_child: { type: integer, minimum: 0, maximum: 20 }
        max_occupancy: { type: integer, minimum: 1, maximum: 40 }
        base_occupancy: { type: integer, minimum: 1, maximum: 40 }
        sort_order: { type: integer }
        is_active: { type: boolean }
    Room:
      type: object
