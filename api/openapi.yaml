            application/json:
              schema: { $ref: "#/components/schemas/ReservationEmails" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: resendConfirmationEmail
      summary: Queue the confirmation e-mail again (reservation.update)
      description: |
        The e-mail goes through an outbox and a background worker (the answer is 202 with the queued entry). Confirming a reservation queues the first one automatically when the booker has an address. 409 `EMAIL_NOT_CONFIGURED` without a mail server, `RESERVATION_NOT_CONFIRMED`, `GUEST_HAS_NO_EMAIL`, `EMAIL_ALREADY_QUEUED`.
      tags: [documents]
      responses:
        "202":
          description: The queued e-mail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailEntry" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/night-audit/preview:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: previewNightAudit
      summary: The full night audit pre-check (nightaudit.run)
      description: |
        Runs every check and a dry run of the room charges; it writes nothing. `blockers` stop the run: unresolved arrivals (CONFIRMED rooms due to arrive), unresolved departures (OPEN stays due out), room charges in ERROR and posted nights that should not exist. `missing_charges` are READY nights before the business date (the run posts them), `tonight_charges` the READY nights of the business date. `can_run` is true when the time guard passes and nothing blocks.
      tags: [nightaudit]
      responses:
        "200":
          description: The pre-check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NightAuditPreview" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/night-audit/no-shows:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: markNoShows
      summary: Mark exactly the listed unresolved arrivals as no-show (nightaudit.no_show)
      description: |
        One transaction. The request carries the exact `reservation_room_ids` the staff saw and `confirm: true`; the server never expands the set. If any line is no longer CONFIRMED with an arrival date up to the business date, nothing changes and the answer is 409 `NO_SHOW_SET_CHANGED` with the changed lines in `context.changed`. A no-show releases the inventory; no fee is posted.
      tags: [nightaudit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoShowsRequest" }
      responses:
        "200":
          description: The lines that were marked and what still blocks the run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoShowsResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/night-audit/run:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: runNightAudit
      summary: Close the business day (nightaudit.run)
      description: |
        One transaction: advisory lock (409 `NIGHT_AUDIT_IN_PROGRESS`), the open day locked for update (409 `BUSINESS_DATE_MISMATCH`), the time guard (409 `NIGHT_AUDIT_TOO_EARLY`), the checks (409 `NIGHT_AUDIT_BLOCKED`, `context.blockers` has the shape of the preview's), housekeeping (rooms with an open segment become DIRTY when the property is configured so), the room charges (trigger NIGHT_AUDIT), a revalidation, the closing summary, and the move to the next business date. Any blocker rolls back everything, including the charges posted. It never changes a guest, reservation or stay status.
      tags: [nightaudit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunNightAuditRequest" }
      responses:
        "200":
          description: The day is closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NightAuditResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/night-audit/room-charges/preview:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: previewRoomCharges
      summary: Preview the room charges that are due (nightaudit.run or folio.post_charge)
      description: |
        A dry run of the room charge posting: which nights of which stays are READY, already posted, not applicable or in ERROR, with the service charge, tax and total the engine calculates. It modifies nothing. `business_date` must be the open business date (409 `BUSINESS_DATE_MISMATCH`). Without `stay_ids` every in-house stay is considered.
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomChargeRequest" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomChargePreview" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/night-audit/room-charges:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: postRoomCharges
      summary: Post the room charges that are due (nightaudit.run or folio.post_charge)
      description: |
        Posts every READY night (earlier nights that were never posted and tonight's) through the folio posting service, in the order of stay and night, and records each in the posting register. The stays are locked first, so concurrent runs cannot charge a night twice; a second run answers `ALREADY_POSTED`. ERROR nights (no open folio, no nightly rate, no room for the night, an invalid charge code) are reported and never posted. `revalidation` re-reads the scope after the commit.
      tags: [billing]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomChargeRequest" }
      responses:
        "200":
          description: The results and the revalidation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomChargePostResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/companies:
    parameters:
