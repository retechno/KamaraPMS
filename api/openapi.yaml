        new_guest: { $ref: "#/components/schemas/WalkInGuest" }
        room_id: { type: integer, format: int64 }
        rate_plan_id: { type: integer, format: int64 }
        departure_date: { $ref: "#/components/schemas/Date" }
        adult_count: { type: integer, minimum: 1 }
        child_count: { type: integer, minimum: 0, default: 0 }
        nightly_overrides:
          type: array
          items: { $ref: "#/components/schemas/NightOverride" }
        accompanying_guest_ids:
          type: array
          items: { type: integer, format: int64 }
        override_room_not_ready: { type: boolean, default: false }
        override_reason: { type: string, maxLength: 500 }
    ReverseCheckInRequest:
      type: object
      required: [version, reason]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, description: The stay's version. }
        reason: { type: string, maxLength: 500 }
    Stay:
      type: object
      required: [id, stay_number, reservation_id, reservation_room_id, guest_id, arrival_date, departure_date, adult_count, child_count, status, actual_check_in_at, actual_check_out_at, version]
      properties:
        id: { type: integer, format: int64 }
        stay_number: { type: string }
        reservation_id: { type: integer, format: int64 }
        reservation_room_id: { type: integer, format: int64 }
        guest_id: { type: integer, format: int64 }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
        adult_count: { type: integer }
        child_count: { type: integer }
        status: { type: string, enum: [OPEN, CHECKED_OUT, CANCELLED] }
        actual_check_in_at: { type: string, format: date-time }
        actual_check_out_at: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int32 }
    StaySegment:
      type: object
      required: [id, room_id, room_number, check_in_at, check_out_at, start_business_date, end_business_date]
      properties:
        id: { type: integer, format: int64 }
        room_id: { type: integer, format: int64 }
        room_number: { type: string }
        check_in_at: { type: string, format: date-time }
        check_out_at: { type: [string, "null"], format: date-time }
        start_business_date: { $ref: "#/components/schemas/Date" }
        end_business_date:
          oneOf:
            - { $ref: "#/components/schemas/Date" }
            - { type: "null" }
        move_reason: { type: string }
    StayFolio:
      type: object
      required: [id, folio_number, status, balance]
      properties:
        id: { type: integer, format: int64 }
        folio_number: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        balance: { type: string }
    ReservationRef:
      type: object
      required: [id, confirmation_number]
      properties:
        id: { type: integer, format: int64 }
        confirmation_number: { type: string }
        status: { type: string }
        version: { type: integer, format: int32 }
    CheckInResult:
      type: object
      required: [stay, stay_room, folio]
      properties:
        reservation: { $ref: "#/components/schemas/ReservationRef" }
        stay: { $ref: "#/components/schemas/Stay" }
        stay_room: { $ref: "#/components/schemas/StaySegment" }
        folio: { $ref: "#/components/schemas/StayFolio" }
    ReverseResult:
      type: object
      required: [stay, folio]
      properties:
        stay: { $ref: "#/components/schemas/Stay" }
        folio: { $ref: "#/components/schemas/StayFolio" }
    MoveRequest:
      type: object
      required: [version, room_id, reason]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, description: The stay's version. }
        room_id: { type: integer, format: int64 }
        reason: { type: string, maxLength: 500 }
        new_nightly_rates:
          type: array
          items: { $ref: "#/components/schemas/NightOverride" }
        override_room_not_ready: { type: boolean, default: false }
        override_reason: { type: string, maxLength: 500 }
    MoveResult:
      type: object
      required: [stay, closed_segment, new_segment]
      properties:
        stay: { $ref: "#/components/schemas/Stay" }
        closed_segment: { $ref: "#/components/schemas/StaySegment" }
        new_segment: { $ref: "#/components/schemas/StaySegment" }
    ChangeDepartureRequest:
      type: object
      required: [version, departure_date]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, description: The stay's version. }
        departure_date: { $ref: "#/components/schemas/Date" }
        nightly_overrides:
          type: array
          items: { $ref: "#/components/schemas/NightOverride" }
    AddStayGuestRequest:
      type: object
      required: [guest_id]
      additionalProperties: false
      properties:
        guest_id: { type: integer, format: int64 }
    CheckOutRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, description: The stay's version. }
        confirm_early_departure: { type: boolean, default: false }
    ClosedFolio:
      type: object
      required: [id, folio_number, status]
      properties:
        id: { type: integer, format: int64 }
        folio_number: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
    CheckOutResult:
      type: object
      required: [stay, posted_room_charges, folios, housekeeping]
      properties:
        stay: { $ref: "#/components/schemas/Stay" }
        posted_room_charges:
          type: array
          items: { $ref: "#/components/schemas/RoomChargeItem" }
        folios:
          type: array
          items: { $ref: "#/components/schemas/ClosedFolio" }
        housekeeping: { type: string, description: The housekeeping status the room has now (DIRTY). }
    StaySummary:
      type: object
      required: [id, stay_number, status, guest_id, guest_name, room_id, reservation_id, confirmation_number, arrival_date, departure_date, adult_count, child_count, version]
      properties:
        id: { type: integer, format: int64 }
        stay_number: { type: string }
        status: { type: string, enum: [OPEN, CHECKED_OUT, CANCELLED] }
        guest_id: { type: integer, format: int64 }
        guest_name: { type: string }
        room_id: { type: [integer, "null"], format: int64 }
        room_number: { type: string }
        reservation_id: { type: integer, format: int64 }
        confirmation_number: { type: string }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
        adult_count: { type: integer }
        child_count: { type: integer }
        version: { type: integer, format: int32 }
    StayPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/StaySummary" }
        next_cursor: { type: string }
    Arrival:
      type: object
      required: [reservation_id, confirmation_number, reservation_room_id, reservation_version, guest_id, room_type_id, room_type_code, room_id, arrival_date, departure_date, adult_count, child_count]
      properties:
        reservation_id: { type: integer, format: int64 }
        confirmation_number: { type: string }
        reservation_room_id: { type: integer, format: int64 }
        reservation_version: { type: integer, format: int32 }
        guest_id: { type: [integer, "null"], format: int64 }
        guest_name: { type: string }
        room_type_id: { type: integer, format: int64 }
        room_type_code: { type: string }
        room_id: { type: [integer, "null"], format: int64 }
        room_number: { type: string }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
        adult_count: { type: integer }
        child_count: { type: integer }
    StayNight:
      type: object
      required: [date, amount, price_mode, is_override, posted]
      properties:
        date: { $ref: "#/components/schemas/Date" }
        amount: { type: string }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        is_override: { type: boolean }
        posted: { type: boolean }
    StayLine:
      type: object
      required: [id, reservation_id, confirmation_number, room_type_code, status]
      properties:
        id: { type: integer, format: int64 }
        reservation_id: { type: integer, format: int64 }
        confirmation_number: { type: string }
        room_type_code: { type: string }
        status: { type: string }
    StayDetail:
      type: object
      required: [stay, guest, guests, segments, line, nightly_rates, folios]
      properties:
        stay: { $ref: "#/components/schemas/Stay" }
        guest: { $ref: "#/components/schemas/GuestName" }
        guests:
          type: array
          items: { $ref: "#/components/schemas/GuestName" }
        segments:
          type: array
          items: { $ref: "#/components/schemas/StaySegment" }
        line: { $ref: "#/components/schemas/StayLine" }
        nightly_rates:
          type: array
          items: { $ref: "#/components/schemas/StayNight" }
        folios:
          type: array
          items: { $ref: "#/components/schemas/StayFolio" }
    RoomChargeRequest:
      type: object
      required: [business_date]
      additionalProperties: false
      properties:
        business_date: { $ref: "#/components/schemas/Date" }
        stay_ids:
          type: array
          items: { type: integer, format: int64 }
    RoomChargeStatus:
      type: string
      enum: [READY, POSTED, ALREADY_POSTED, NOT_APPLICABLE, ERROR]
    RoomChargeItem:
      type: object
      required: [stay_id, stay_number, guest, folio_id, service_date, room_rate, service_charge, tax, rounding_adjustment, total, status, folio_item_id]
      properties:
        stay_id: { type: integer, format: int64 }
        stay_number: { type: string }
        guest: { type: string }
        room_number: { type: string }
        folio_id: { type: [integer, "null"], format: int64 }
        service_date: { $ref: "#/components/schemas/Date" }
        charge_code: { type: string }
        room_rate: { type: string, description: The agreed nightly amount from the stay's price snapshot. }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        service_charge: { type: string }
        tax: { type: string }
        rounding_adjustment: { type: string }
        total: { type: string }
        status: { $ref: "#/components/schemas/RoomChargeStatus" }
        reason: { type: string, description: "For NOT_APPLICABLE and ERROR: STAY_NOT_ACTIVE, STAY_CLOSED, NO_ROOM_FOR_NIGHT, MISSING_NIGHTLY_RATE, INVALID_CHARGE_CODE or NO_OPEN_FOLIO." }
        folio_item_id: { type: [integer, "null"], format: int64 }
    RoomChargePreview:
      type: object
      required: [business_date, items, totals]
      properties:
        business_date: { $ref: "#/components/schemas/Date" }
        items:
          type: array
          items: { $ref: "#/components/schemas/RoomChargeItem" }
        totals:
          type: object
          required: [ready_count, ready_total]
          properties:
            ready_count: { type: integer }
            ready_total: { type: string }
    RoomChargePosted:
      type: object
      required: [stay_id, service_date, status]
      properties:
        stay_id: { type: integer, format: int64 }
        service_date: { $ref: "#/components/schemas/Date" }
        status: { $ref: "#/components/schemas/RoomChargeStatus" }
        folio_item_id: { type: integer, format: int64 }
        total: { type: string }
        reason: { type: string }
    InvalidPosting:
      type: object
      required: [stay_id, stay_number, service_date, folio_item_id, reason]
      description: A posted room night that should not exist (outside the stay's nights, or the stay was cancelled).
      properties:
        stay_id: { type: integer, format: int64 }
        stay_number: { type: string }
        service_date: { $ref: "#/components/schemas/Date" }
        folio_item_id: { type: integer, format: int64 }
        reason: { type: string, enum: [OUTSIDE_STAY, STAY_CANCELLED] }
    RoomChargeRevalidation:
      type: object
      required: [ready, errors, invalid]
      properties:
        ready: { type: integer }
        errors:
          type: array
          items: { $ref: "#/components/schemas/RoomChargeItem" }
        invalid:
          type: array
          items: { $ref: "#/components/schemas/InvalidPosting" }
    RoomChargePostResponse:
      type: object
      required: [results, revalidation]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/RoomChargePosted" }
        revalidation: { $ref: "#/components/schemas/RoomChargeRevalidation" }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, examples: ["urn:kamarapms:problem:ROOM_NOT_AVAILABLE"] }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable error code.
          examples: [ROOM_NOT_AVAILABLE, VERSION_CONFLICT, RESOURCE_BUSY]
        detail: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        context:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
          description: The same request may succeed if retried (temporary contention).
        request_id: { type: string }
