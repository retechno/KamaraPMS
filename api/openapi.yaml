      description: "`totals` is only filled when `business_date` is given: paid, refunded and net per method, voided payments excluded."
      tags: [folios]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: business_date, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: method, in: query, schema: { $ref: "#/components/schemas/PaymentMethod" } }
      responses:
