    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listTaxReturns
      summary: Tax returns, newest period first (tax.view)
      tags: [tax]
      parameters:
        - { name: tax_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [FILED, VOIDED] } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxFilingReturnList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
