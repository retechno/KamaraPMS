        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaxRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tax" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/taxes/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateTax
      summary: Edit a tax (billing_config.manage); the code cannot change
      description: "A rate change affects future postings only; the response then carries `affected_open_stays`. Deactivation is 409 `TAX_IN_USE` while the tax is mapped to a charge code."
      tags: [billing-config]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchTaxRequest" }
      responses:
        "200":
          description: The updated resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tax" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/service-charges:
    parameters:
