        - { name: entity_type, in: query, schema: { type: string, maxLength: 50 } }
        - { name: entity_id, in: query, schema: { type: integer, format: int64 } }
        - { name: user_id, in: query, schema: { type: integer, format: int64 } }
        - { name: action, in: query, schema: { type: string, maxLength: 100 }, description: "An exact action such as `stay.checked_in`." }
        - { name: from, in: query, schema: { $ref: "#/components/schemas/Date" }, description: First business date. }
        - { name: to, in: query, schema: { $ref: "#/components/schemas/Date" }, description: Last business date. }
      responses:
