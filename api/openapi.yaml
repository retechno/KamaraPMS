          type: array
          items: { type: string, enum: [SAME_EMAIL, SAME_PHONE, SAME_ID_DOCUMENT, SAME_NAME_AND_BIRTH_DATE] }
    CreatedGuest:
      allOf:
        - $ref: "#/components/schemas/Guest"
        - type: object
          required: [possible_duplicates, hidden_duplicate_count]
          properties:
            possible_duplicates:
              type: array
              items: { $ref: "#/components/schemas/PossibleDuplicate" }
            hidden_duplicate_count:
              type: integer
              description: Look-alike profiles the caller may not see.
    GuestHistoryItem:
      type: object
      required: [type, id, number, role, status, property_id, property_code, property_name, arrival_date, departure_date]
      properties:
        type: { type: string, enum: [RESERVATION, STAY] }
        id: { type: integer, format: int64 }
        number: { type: string, description: Confirmation or stay number. }
        role: { type: string, enum: [BOOKER, OCCUPANT, PRIMARY, ACCOMPANYING] }
        status: { type: string }
        property_id: { type: integer, format: int64 }
        property_code: { type: string }
        property_name: { type: string }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
    GuestHistory:
      type: object
      required: [data, hidden_count]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/GuestHistoryItem" }
        next_cursor: { type: string }
        hidden_count: { type: integer, description: Items at properties the caller may not see. }
    Percent:
      type: string
      pattern: '^[0-9]{1,3}(\.[0-9]{1,4})?$'
      description: A percentage from 0 to 100 with at most four decimals. Always returned with four decimals.
      examples: ["11.0000"]
    Amount:
      type: string
      pattern: '^[0-9]{1,15}(\.[0-9]{1,3})?$'
      description: A non-negative decimal amount as a string. It may not have more decimals than the property currency.
      examples: ["250000"]
    ChargeType:
      type: string
      enum: [ROOM, FOOD_BEVERAGE, SERVICE, FEE, OTHER]
    PriceMode:
      type: string
      enum: [EXCLUSIVE, INCLUSIVE]
      description: Whether a price excludes or already contains the mapped service charges and taxes.
    GlAccountCode:
      type: [string, "null"]
      description: |
        An account code of the chart of accounts the accounting module will own (text, never an id), for example `4-1100` or `2.1.05`. Optional until accounting exists; the PMS only checks its shape.
    Tax:
      type: object
      required: [id, code, name, rate, tax_on_service, gl_account_code, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rate: { $ref: "#/components/schemas/Percent" }
        tax_on_service: { type: boolean, description: The tax is also levied on the service charges. }
        gl_account_code: { $ref: "#/components/schemas/GlAccountCode", description: "Tax payable account of the chart of accounts, copied onto the ledger when an item is posted." }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        affected_open_stays:
          type: integer
          description: Only on an update that changed the rate. Open stays that will be charged at the new rate from now on.
    TaxPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Tax" }
        next_cursor: { type: string }
    CreateTaxRequest:
      type: object
      required: [code, name, rate]
      additionalProperties: false
      properties:
        code: { type: string, description: "1-20 characters, A-Z 0-9 - _ (upper-cased)." }
        name: { type: string, maxLength: 100 }
        rate: { $ref: "#/components/schemas/Percent" }
        tax_on_service: { type: boolean, default: false }
        gl_account_code: { type: string, description: "Account code (A-Z 0-9 . - _ : /, at most 30 characters, upper-cased). Optional." }
        is_active: { type: boolean, default: true }
    PatchTaxRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        rate: { $ref: "#/components/schemas/Percent" }
        tax_on_service: { type: boolean }
        gl_account_code: { type: string, description: "An account code, or an empty string to clear it." }
        is_active: { type: boolean }
    ServiceCharge:
      type: object
      required: [id, code, name, rate, gl_account_code, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rate: { $ref: "#/components/schemas/Percent" }
        gl_account_code: { $ref: "#/components/schemas/GlAccountCode", description: "Service charge payable account (optional)." }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        affected_open_stays: { type: integer, description: Only on an update that changed the rate. }
    ServiceChargePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ServiceCharge" }
        next_cursor: { type: string }
    CreateServiceChargeRequest:
      type: object
      required: [code, name, rate]
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string, maxLength: 100 }
        rate: { $ref: "#/components/schemas/Percent" }
        gl_account_code: { type: string, description: "Account code, optional." }
        is_active: { type: boolean, default: true }
    PatchServiceChargeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        rate: { $ref: "#/components/schemas/Percent" }
        is_active: { type: boolean }
    TaxRule:
      type: object
      required: [tax_id, code, name, rate, tax_on_service, sequence]
      properties:
        tax_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rate: { $ref: "#/components/schemas/Percent" }
        tax_on_service: { type: boolean }
        sequence: { type: integer, description: Calculation and display order. }
    ServiceRule:
      type: object
      required: [service_charge_id, code, name, rate, sequence]
      properties:
        service_charge_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rate: { $ref: "#/components/schemas/Percent" }
        sequence: { type: integer }
    ChargeCode:
      type: object
      required: [id, code, name, charge_type, price_mode, gl_account_code, is_system, is_active, taxes, service_charges, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        charge_type: { $ref: "#/components/schemas/ChargeType" }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        default_unit_price: { $ref: "#/components/schemas/Amount" }
        gl_account_code: { $ref: "#/components/schemas/GlAccountCode", description: "Revenue account of this charge (optional). Copied onto the ledger when an item is posted." }
        is_system: { type: boolean }
        is_active: { type: boolean }
        taxes:
          type: array
          description: Active tax rules in calculation order.
          items: { $ref: "#/components/schemas/TaxRule" }
        service_charges:
          type: array
          description: Active service rules in calculation order.
          items: { $ref: "#/components/schemas/ServiceRule" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChargeCodePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ChargeCode" }
        next_cursor: { type: string }
    CreateChargeCodeRequest:
      type: object
      required: [code, name, charge_type, price_mode]
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string, maxLength: 100 }
        charge_type: { $ref: "#/components/schemas/ChargeType" }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        default_unit_price: { $ref: "#/components/schemas/Amount" }
        gl_account_code: { type: string, description: "Revenue account code, optional." }
        is_active: { type: boolean, default: true }
    PatchChargeCodeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        charge_type: { $ref: "#/components/schemas/ChargeType" }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        default_unit_price: { type: string, description: An amount, or an empty string to clear it. }
        gl_account_code: { type: string, description: "An account code, or an empty string to clear it." }
        is_active: { type: boolean }
    ReplaceRulesRequest:
      type: object
      additionalProperties: false
      properties:
        taxes:
          type: array
          maxItems: 20
          items:
            type: object
            required: [tax_id, sequence]
            additionalProperties: false
            properties:
              tax_id: { type: integer, format: int64 }
              sequence: { type: integer, minimum: 1, maximum: 32767 }
        service_charges:
          type: array
          maxItems: 20
          items:
            type: object
            required: [service_charge_id, sequence]
            additionalProperties: false
            properties:
              service_charge_id: { type: integer, format: int64 }
              sequence: { type: integer, minimum: 1, maximum: 32767 }
    SignedAmount:
      type: string
      pattern: '^-?[0-9]{1,16}(\.[0-9]{1,4})?$'
      description: A plain decimal amount as a string, possibly negative. No separators or exponents.
      examples: ["1000000", "-7.05"]
    CalculateChargeRequest:
      type: object
      required: [charge_code_id, quantity, unit_price]
      additionalProperties: false
      properties:
        charge_code_id: { type: integer, format: int64 }
        quantity: { $ref: "#/components/schemas/SignedAmount" }
        unit_price: { $ref: "#/components/schemas/SignedAmount" }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        discount_amount: { $ref: "#/components/schemas/SignedAmount" }
    CalculationComponent:
      type: object
      required: [rule_id, code, name, rate, base_amount, amount, sequence]
      properties:
        rule_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rate: { $ref: "#/components/schemas/Percent" }
        tax_on_service: { type: boolean, description: Taxes only. }
        base_amount: { type: string, description: The amount the rate was applied to. }
        amount: { type: string }
        sequence: { type: integer }
    ChargeCalculation:
      type: object
      required: [price_mode, quantity, unit_price, base_amount, discount_amount, net_amount, rounding_adjustment, service_charges, taxes, service_charge_total, tax_total, taxable_amount, total_amount]
      properties:
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        quantity: { type: string }
        unit_price: { type: string }
        base_amount: { type: string, description: round(quantity x unit price), as quoted. }
        discount_amount: { type: string, description: Signed like base_amount. }
        net_amount: { type: string, description: Net revenue; includes the rounding adjustment. }
        rounding_adjustment: { type: string, description: Always 0 for an exclusive price. }
        service_charges:
          type: array
          items: { $ref: "#/components/schemas/CalculationComponent" }
        taxes:
          type: array
          items: { $ref: "#/components/schemas/CalculationComponent" }
        service_charge_total: { type: string }
        tax_total: { type: string }
        taxable_amount: { type: string, description: The largest tax base (display only). }
        total_amount: { type: string, description: Net + service + tax; equals the quoted price when inclusive. }
    MealPlan:
      type: string
      enum: [RO, BB, HB, FB, AI]
      description: Room only, bed and breakfast, half board, full board, all inclusive. Informational in the MVP.
    RatePlan:
