          description: A page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}/invoice.pdf:
    parameters:
