      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSupplier
      summary: Add a supplier (payables.manage)
      tags: [payables]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSupplierRequest" }
      responses:
        "201":
          description: The supplier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payables/suppliers/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSupplier
      summary: One supplier (payables.view)
      tags: [payables]
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateSupplier
      summary: Change a supplier (payables.manage)
      description: The code never changes. A default account below 1 removes it.
      tags: [payables]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSupplierRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payables/suppliers/{id}/open-bills:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listOpenBills
      summary: What is still owed on the bills of a supplier, oldest due date first (payables.view)
      tags: [payables]
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenBillList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payables/bills:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listBills
      summary: Supplier bills, newest first (payables.view)
      tags: [payables]
      parameters:
        - { name: supplier_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [POSTED, VOIDED] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: Text in the bill number, the supplier's invoice number or the supplier's name., schema: { type: string } }
        - { name: open_only, in: query, description: Only bills with something still owed., schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: postBill
      summary: Enter a supplier bill (payables.post)
      description: "The `Idempotency-Key` header is required. The journal debits each line's account against ACCOUNTS PAYABLE on the bill date; the date is not after the current business date nor before the accounting start date, and its month is open (409 `PERIOD_CLOSED`). The due date defaults to the bill date plus the supplier's payment terms. The same invoice of a supplier is entered once (409 `DUPLICATE_INVOICE`; a voided one may be entered again). 409 `SUPPLIER_INACTIVE`."
      tags: [payables]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostBillRequest" }
      responses:
        "201":
          description: The bill with its lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payables/bills/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getBill
      summary: One bill with its lines (payables.view)
      tags: [payables]
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payables/bills/{id}/void:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: voidBill
      summary: Void a bill without payments (payables.post, needs approval)
      description: "The journal of the bill is reversed on the current business date. 409 `BILL_HAS_PAYMENTS` (void the payments first), `BILL_ALREADY_VOIDED`."
      tags: [payables]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payables/payments:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listSupplierPayments
      summary: Payments to suppliers, newest first (payables.view)
      tags: [payables]
      parameters:
        - { name: supplier_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [POSTED, VOIDED] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierPaymentList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: postSupplierPayment
      summary: Pay a supplier (payables.post)
      description: "The `Idempotency-Key` header is required. A payment is the sum of what it settles: each allocation names an open bill of the supplier and an amount up to what is still owed (409 `ALLOCATION_EXCEEDS_OUTSTANDING`, one field error per allocation, checked under the supplier's row lock so two payments cannot overpay a bill). The journal debits ACCOUNTS PAYABLE against the cash, bank or other payment account of the method."
      tags: [payables]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostSupplierPaymentRequest" }
      responses:
        "201":
          description: The payment with what it settles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierPayment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payables/payments/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSupplierPayment
      summary: One payment with the bills it settles (payables.view)
      tags: [payables]
      responses:
        "200":
          description: The result.
          content:
            application/json:
