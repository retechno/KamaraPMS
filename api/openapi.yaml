              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/emails:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listReservationEmails
      summary: The e-mails of a reservation and whether e-mail is on (reservation.read)
      tags: [documents]
      responses:
        "200":
          description: The e-mails, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationEmails" }
