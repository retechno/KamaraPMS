      summary: One company's account (cityledger.read)
      tags: [city-ledger]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerAccount" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}/statement:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCityLedgerStatement
      summary: A company's movements with the running balance (cityledger.read)
      description: "`from` and `to` are optional business dates (inclusive). A period that starts after earlier movements opens with their balance. Lines are ordered by date, transfers before receipts; a voided line is listed but does not move the balance."
      tags: [city-ledger]
      parameters:
        - { name: from, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: to, in: query, schema: { $ref: "#/components/schemas/Date" } }
      responses:
        "200":
          description: The statement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerStatement" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}/aging:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCityLedgerAging
      summary: What a company owes by age of the transfer (cityledger.read)
      description: As of the current business date, in the buckets 0-30, 31-60, 61-90 and 90+ days. Receipts settle the oldest transfers first.
      tags: [city-ledger]
      responses:
        "200":
          description: The aging.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerAging" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}/receipts:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listCityLedgerReceipts
      summary: A company's receipts, oldest first (cityledger.read)
      description: Not paginated.
      tags: [city-ledger]
      responses:
        "200":
          description: The receipts, voided ones included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerReceiptList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: receiveCityLedgerPayment
      summary: Record money a company paid against its account (cityledger.receive)
      description: |
        The receipt cannot exceed what the company owes (409 `RECEIPT_EXCEEDS_BALANCE`, with `context.balance`); the
        company row is locked, so receipts taken at once cannot exceed it together. The receipt number comes from the
        CITY_LEDGER_RECEIPT series. `allocations` pay invoices of the company with this receipt (the sum is at most the
        amount; what is left stays on account): each invoice must be an issued invoice of the company (404
        `INVOICE_NOT_FOUND`, 409 `INVOICE_NOT_PAYABLE`) and may not be paid more than it still owes (409
        `ALLOCATION_EXCEEDS_INVOICE`, with `context.invoice_id` and `context.outstanding`).
      tags: [city-ledger]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiveRequest" }
      responses:
        "201":
          description: The receipt and the account's balance after it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerReceiptResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/receipts/{id}/void:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: voidCityLedgerReceipt
      summary: Void a receipt taken on the current business date (cityledger.receive, needs approval)
      tags: [city-ledger]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionRequest" }
      responses:
        "200":
          description: The voided receipt and the account's balance after it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerReceiptResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}/invoice-candidates:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listCityLedgerInvoiceCandidates
      summary: Transfers of a company that are not on an invoice yet (cityledger.read)
      description: "Oldest first. `invoiceable` is true once the guest of the folio has checked out; transfers of guests still in house are listed but cannot be invoiced. Not paginated."
      tags: [city-ledger]
      responses:
        "200":
          description: The transfers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerCandidateList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}/invoices:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listCityLedgerInvoices
      summary: A company's invoices, newest first, without their lines (cityledger.read)
      description: Not paginated. Voided invoices are listed.
      tags: [city-ledger]
      responses:
        "200":
          description: The invoices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerInvoiceList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCityLedgerInvoice
      summary: Issue one invoice over several transfers of a company (cityledger.invoice)
      description: |
        Combines the given transfers (at most 200) into one invoice. Every transfer must belong to the company, be
        posted, not be on another live invoice (409 `TRANSFER_NOT_AVAILABLE`) and belong to a guest who has checked out
        (409 `STAY_NOT_CHECKED_OUT`); both carry `context.payment_ids`. The due date is the invoice date plus the
        company's payment terms. The company row is locked, so two invoices cannot claim the same transfer. An invoice
        is a billing document: it does not change what the company owes.
      tags: [city-ledger]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCityLedgerInvoiceRequest" }
      responses:
        "201":
          description: The invoice with its lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerInvoice" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCityLedgerInvoice
      summary: One invoice with its lines (cityledger.read)
      tags: [city-ledger]
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerInvoice" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/invoices/{id}/void:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: voidCityLedgerInvoice
      summary: Void an invoice (cityledger.invoice, needs approval)
      description: Its transfers are released and can be invoiced again. 409 `INVOICE_ALREADY_VOIDED` for a voided invoice, 409 `INVOICE_HAS_PAYMENTS` while posted receipts have paid it (void them first).
      tags: [city-ledger]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionRequest" }
      responses:
        "200":
          description: The voided invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerInvoice" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/invoices/{id}/invoice.pdf:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCityLedgerInvoicePdf
      summary: Invoice to a company as a PDF (cityledger.read)
      description: "One line per checked-out stay (check-out date, guest, room, stay dates, folio, reference, amount), the total and the due date. A voided invoice is stamped VOID. File name `invoice-<invoice number>.pdf`."
      tags: [documents]
      responses:
        "200":
          description: The document as a PDF (never cached).
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/rooms/{id}/housekeeping/flags:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setRoomHousekeepingFlags
      summary: Replace a room's housekeeping flags (housekeeping.update)
      description: "Priority (HIGH rooms come first on the cleaning list), do not disturb, a make-up request and a note. A flag change is not a status change: the time the room has been in its status does not restart."
      tags: [housekeeping]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HousekeepingFlagsRequest" }
      responses:
        "200":
          description: The flags.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingFlags" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/housekeeping/staff:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listHousekeepingStaff
      summary: Who can be given cleaning work (housekeeping.assign)
      description: Active users whose role holds housekeeping.update at the property, and tenant administrators. Not paginated.
      tags: [housekeeping]
      responses:
        "200":
          description: The staff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingStaffList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/housekeeping/tasks:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listHousekeepingTasks
      summary: The cleaning list of a business date with the workload per person
      description: "Ordered with high priority first, then by floor and room. `date` defaults to the current business date. Not paginated. The workload has one line per housekeeper and one for tasks not assigned yet (`user_id` null)."
      tags: [housekeeping]
      parameters:
        - { name: date, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/HousekeepingTaskStatus" } }
        - { name: assigned_to, in: query, schema: { type: integer, format: int64 } }
        - { name: unassigned, in: query, schema: { type: boolean } }
        - { name: floor, in: query, schema: { type: string } }
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingTaskList" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createHousekeepingTask
      summary: Add a task by hand for the current business date (housekeeping.assign)
      tags: [housekeeping]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHousekeepingTaskRequest" }
      responses:
        "201":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingTask" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/housekeeping/tasks/generate:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: generateHousekeepingTasks
      summary: Generate the cleaning list of the current business date (housekeeping.assign)
      description: |
        Occupied rooms get a CHECKOUT task (the guest leaves today or is overdue) or a STAYOVER task; a vacant room that
        is not clean gets an ARRIVAL task when a guest is assigned to it today, otherwise a DIRTY task. Arrivals and rooms
        flagged HIGH get high priority. A room that already has a task that day gets no second kind, and a room under a
        block gets none. Running it again only adds what is new, so it can be run through the day, also by two people at once.
      tags: [housekeeping]
      responses:
        "200":
          description: How many tasks this run added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateHousekeepingResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/housekeeping/tasks/assign:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: assignHousekeepingTasks
      summary: Give tasks to a housekeeper, or take them back with a null user (housekeeping.assign)
      description: Only open tasks can be assigned; if any is not (or does not exist) nothing changes (409 `TASK_NOT_ASSIGNABLE`, `context.task_ids`). The assignee must be staff (422 `ASSIGNEE_INVALID`).
      tags: [housekeeping]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignHousekeepingRequest" }
      responses:
        "200":
          description: How many tasks were assigned.
          content:
            application/json:
              schema:
                type: object
                required: [assigned]
                properties:
                  assigned: { type: integer }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/housekeeping/tasks/{taskId}/start:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: startHousekeepingTask
      summary: Start a pending task (housekeeping.update)
      description: An unassigned task goes to the person who starts it and a DIRTY room becomes CLEANING. 409 `TASK_NOT_PENDING` otherwise.
      tags: [housekeeping]
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingTask" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/housekeeping/tasks/{taskId}/complete:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: completeHousekeepingTask
      summary: Finish a task (housekeeping.update)
      description: A DIRTY or CLEANING room becomes CLEAN; a room that is already CLEAN or INSPECTED keeps its status. Finishing a task never inspects the room. 409 `TASK_ALREADY_CLOSED` when it is already finished (also when two people finish it at once).
      tags: [housekeeping]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                notes: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingTask" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/housekeeping/tasks/{taskId}/skip:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: skipHousekeepingTask
      summary: Close a task without cleaning (housekeeping.update)
      description: A reason is required (for example that the guest asked not to be disturbed). The room's status does not change.
      tags: [housekeeping]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingTask" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/maintenance-staff:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listMaintenanceStaff
      summary: Who can take maintenance work (maintenance.manage)
      description: Active users whose role holds maintenance.report or maintenance.manage at the property, and tenant administrators. Not paginated.
      tags: [maintenance]
      responses:
        "200":
          description: The staff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingStaffList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/maintenance-requests:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listMaintenanceRequests
      summary: List maintenance requests, newest first (maintenance.report)
      tags: [maintenance]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MaintenanceStatus" } }
        - { name: open, in: query, description: Only OPEN and IN_PROGRESS requests., schema: { type: boolean } }
        - { name: room_id, in: query, schema: { type: integer, format: int64 } }
        - { name: assigned_to, in: query, schema: { type: integer, format: int64 } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/MaintenanceCategory" } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/MaintenancePriority" } }
      responses:
        "200":
          description: A page of requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequestPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createMaintenanceRequest
      summary: Report a problem (maintenance.report)
      description: "Against a room (`room_id`) or a place (`location`, for example Lobby); at least one is required. The request starts OPEN with the number MNT…."
      tags: [maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMaintenanceRequest" }
      responses:
        "201":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/maintenance-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getMaintenanceRequest
      summary: One maintenance request (maintenance.report)
      tags: [maintenance]
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateMaintenanceRequest
      summary: Change the details of an open request (maintenance.manage)
      description: 409 `REQUEST_NOT_OPEN` once it is resolved or cancelled.
      tags: [maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchMaintenanceRequest" }
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/maintenance-requests/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: assignMaintenanceRequest
      summary: Give an open request to a technician, or take it back (maintenance.manage)
      description: "A null user takes it back. The technician must be staff (field error `ASSIGNEE_INVALID`)."
      tags: [maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignMaintenanceRequest" }
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/maintenance-requests/{id}/start:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: startMaintenanceRequest
      summary: Start work on an OPEN request (maintenance.manage)
      description: "An unassigned request goes to the person who starts it. 409 `REQUEST_NOT_OPEN` otherwise."
      tags: [maintenance]
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/maintenance-requests/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resolveMaintenanceRequest
      summary: Mark an open request as repaired (maintenance.manage)
      description: "With `release_block` the room block taken for the request is cancelled too (needs room_block.manage). Two people closing a request at once: one wins, the other gets 409 `REQUEST_NOT_OPEN`."
      tags: [maintenance]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseMaintenanceRequest" }
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/maintenance-requests/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelMaintenanceRequest
      summary: Cancel an open request (maintenance.manage)
      description: "A reason (`note`) is required; `release_block` works as for resolve."
      tags: [maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseMaintenanceRequest" }
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/maintenance-requests/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reopenMaintenanceRequest
      summary: Put a resolved request back to OPEN (maintenance.manage)
      description: "For a repair that did not hold. 409 `REQUEST_NOT_RESOLVED` otherwise."
      tags: [maintenance]
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/maintenance-requests/{id}/block:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: blockRoomForMaintenanceRequest
      summary: Take the request's room out of sale (maintenance.manage and room_block.manage)
      description: "Creates an OOO or OOS room block from the start date (default today) to the end date (exclusive) with the request as its reason, and links it. 409 `REQUEST_HAS_NO_ROOM`, `REQUEST_ALREADY_BLOCKED` (one live block per request), and the usual `ROOM_BLOCK_CONFLICT` when a stay or reservation holds the room; a failed block changes nothing."
      tags: [maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockMaintenanceRequest" }
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/lost-found:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listLostFoundItems
      summary: List lost and found items, newest first (lostfound.report)
      tags: [lost-found]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/LostFoundStatus" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/LostFoundCategory" } }
        - { name: room_id, in: query, schema: { type: integer, format: int64 } }
        - { name: found_from, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: found_to, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: q, in: query, description: "Matches the item number, description, storage place, possible owner or who took it.", schema: { type: string } }
      responses:
        "200":
          description: A page of items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LostFoundPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createLostFoundItem
      summary: Record an item that was found (lostfound.report)
      description: "In a room (`room_id`) or at a place (`location`, for example Pool); at least one is required. Dated with the current business date and numbered LF…."
      tags: [lost-found]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLostFoundItem" }
      responses:
        "201":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LostFoundItem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/lost-found/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getLostFoundItem
      summary: One item (lostfound.report)
      tags: [lost-found]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LostFoundItem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateLostFoundItem
      summary: Change the details of a stored item (lostfound.manage)
      description: 409 `ITEM_NOT_STORED` once it has been handed back or disposed of.
      tags: [lost-found]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchLostFoundItem" }
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LostFoundItem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/lost-found/{id}/possible-owners:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listLostFoundPossibleOwners
      summary: Guests who had the item's room around the day it was found (lostfound.report and reservation.read)
      description: "A hint, not a match: the guests of stays whose room segment covered the day the item was found or ended in the three days before. Empty for an item found at a place. Not paginated."
      tags: [lost-found]
      responses:
        "200":
          description: The guests, most recent stay first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LostFoundOwnerList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/lost-found/{id}/return:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: returnLostFoundItem
      summary: Hand a stored item back to its owner (lostfound.manage)
      description: "Records who took it and what was checked; final. 409 `ITEM_NOT_STORED` when it was already closed (also when two desks close it at once)."
      tags: [lost-found]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnLostFoundItem" }
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LostFoundItem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/lost-found/{id}/dispose:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: disposeLostFoundItem
      summary: Close a stored item that nobody claimed (lostfound.manage)
      description: "A reason is required; final."
      tags: [lost-found]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisposeLostFoundItem" }
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LostFoundItem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reports/housekeeping-productivity:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getHousekeepingProductivityReport
      summary: What each housekeeper did (report.view)
      description: "Per person and business date: rooms taken to CLEAN and to INSPECTED by hand (from the status log, a room cleaned twice counts twice), tasks finished and skipped on the cleaning list, and the average minutes between starting and finishing the tasks that were started. `people` totals each person over the range."
      tags: [reports]
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Date" }, description: On or after from; at most 366 days. }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json }, description: "csv answers a text/csv file; text that could be read as a spreadsheet formula is prefixed with an apostrophe." }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingProductivityReport" }
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reports/housekeeping-dirty-rooms:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getHousekeepingDirtyRoomsReport
      summary: Rooms that are not clean yet and for how long (report.view)
      description: "Rooms that are DIRTY or CLEANING, longest first, with the derived occupancy, the priority and do-not-disturb flags and any active block. `min_hours` keeps the rooms that have been in this state at least that long. The age is measured in database time."
      tags: [reports]
      parameters:
        - { name: min_hours, in: query, schema: { type: integer, minimum: 0, maximum: 8760, default: 0 } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json }, description: "csv answers a text/csv file; text that could be read as a spreadsheet formula is prefixed with an apostrophe." }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingDirtyRoomsReport" }
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reports/maintenance:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getMaintenanceReport
      summary: Maintenance requests reported in a range, by category (report.view)
      description: "How the requests of the range ended (resolved, cancelled, still open) and the average hours to resolve, per category and in total, plus the backlog of today (what is open now, how many are high priority, how old the oldest is)."
      tags: [reports]
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Date" }, description: On or after from; at most 366 days. }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json }, description: "csv answers a text/csv file; text that could be read as a spreadsheet formula is prefixed with an apostrophe." }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceReport" }
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/accounts:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listGlAccounts
      summary: The chart of accounts, by code (accounting.view)
      description: "Not paginated (a chart is a few hundred rows). With `format=csv` the whole chart is exported in the layout the import reads: code, name, type, parent_code, postable, group, active, description."
      tags: [accounting]
      parameters:
        - { name: account_type, in: query, schema: { $ref: "#/components/schemas/GlAccountType" } }
        - { name: statement_group, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: postable, in: query, schema: { type: boolean } }
        - { name: q, in: query, description: Matches the code or the name., schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlAccountList" }
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createGlAccount
      summary: Add an account (accounting.manage)
      description: "The code is upper-cased and unique per property (409 `CODE_TAKEN`). A postable account needs a statement group of its type; the parent must be a header account of the same type. The code, type and normal side never change afterwards."
      tags: [accounting]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGlAccount" }
      responses:
        "201":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlAccount" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/accounts/import:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: importGlAccounts
      summary: Add and update accounts from CSV (accounting.manage)
      description: "A row whose code exists updates that account (its type cannot change); other rows create one. The parent codes may appear anywhere in the file. Everything is checked and applied in one transaction: a file with a mistake changes nothing (422 with one field error per row, `rows[N].field`; 409 `ACCOUNT_IN_USE` when it would switch off an account the system posts to). `dry_run` checks and applies it without keeping it."
      tags: [accounting]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportGlAccounts" }
      responses:
        "200":
          description: What the import did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportGlAccountsResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getGlAccount
      summary: One account (accounting.view)
      tags: [accounting]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlAccount" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateGlAccount
      summary: Change an account (accounting.manage)
      description: "The name, parent, group, description and the postable and active flags. An account the system posts to cannot be deactivated or turned into a header (409 `ACCOUNT_IN_USE`); an account with accounts under it cannot take postings (409 `ACCOUNT_HAS_CHILDREN`). `parent_id` below 1 removes the parent."
      tags: [accounting]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchGlAccount" }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlAccount" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteGlAccount
      summary: Delete an account nobody uses (accounting.manage)
      description: "409 `ACCOUNT_IN_USE` while it has accounts under it, is used by the system, a charge code, a tax or a service charge, or has journal lines."
      tags: [accounting]
      responses:
        "204":
          description: Deleted.
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/account-map:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getGlAccountMap
      summary: The accounts the system posts to (accounting.view)
      description: "Ten keys: CASH, CARD, BANK_TRANSFER, OTHER_PAYMENT (what a payment method is received into), CITY_LEDGER and GUEST_LEDGER (the receivables), ADVANCE_DEPOSITS (deposits held until check-out), TAX_PAYABLE and SERVICE_PAYABLE (tax and service charge with no account of their own) and SUSPENSE (anything that cannot be placed). Every key always has an account."
      tags: [accounting]
      responses:
        "200":
          description: The keys with their accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlAccountMapList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setGlAccountMap
      summary: Point system keys at accounts (accounting.manage)
      description: "Each account must be active, take postings and be of the right type (cash and receivables are assets, deposits and payables liabilities; suspense may be anything). All or nothing."
      tags: [accounting]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetGlAccountMap" }
      responses:
        "200":
          description: The keys with their accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlAccountMapList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/unmapped:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listUnmappedGlCodes
      summary: Charge codes, taxes and service charges whose account code the journals cannot use (accounting.view)
      description: "No code, a code that is not in the chart, an inactive account, a header account, or an account of a type that does not fit. Their amounts are posted to the fallback account of the kind (`posted_to`): tax to TAX_PAYABLE, service charge to SERVICE_PAYABLE, everything else to SUSPENSE. Only active items are checked."
      tags: [accounting]
      responses:
        "200":
          description: The problems.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlCodeReport" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/journals:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listJournals
      summary: Journals, newest first (accounting.view)
      tags: [accounting]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/JournalType" } }
        - { name: account_id, in: query, description: Only journals with a line on this account., schema: { type: integer, format: int64 } }
        - { name: q, in: query, description: Text in the number, description or reference., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: The journals, without their lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: postManualJournal
      summary: Post a manual journal (accounting.post)
      description: "The `Idempotency-Key` header is required; the same key returns the first journal. The date is not after the current business date nor before the accounting start date, and its month is open (409 `PERIOD_CLOSED`). Each line is a debit or a credit, at the property's decimals; debits equal credits (field `lines`). The accounts the guest ledger, city ledger and advance deposits are controlled by the day close and refused (`CONTROL_ACCOUNT`)."
      tags: [accounting]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualJournalRequest" }
      responses:
        "201":
          description: The journal with its lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/journals/post-pending:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: postPendingJournals
      summary: Make the journals of closed business days that have none (accounting.close)
      description: "The days from before accounting was set up and any the night audit skipped, oldest first, at most 400 a call. Safe to repeat."
      tags: [accounting]
      responses:
        "200":
          description: How many days were journaled.
          content:
            application/json:
              schema:
                type: object
                required: [posted]
                properties:
                  posted: { type: integer }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/journals/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getJournal
      summary: One journal with its lines (accounting.view)
      tags: [accounting]
      responses:
        "200":
          description: The journal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/journals/{id}/reverse:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reverseJournal
      summary: Reverse a manual journal (accounting.post, needs approval)
      description: "Posts the mirror image (a REVERSAL journal). Only a manual journal, once (409 `JOURNAL_NOT_REVERSIBLE`, `JOURNAL_ALREADY_REVERSED`); a day close journal follows the folios and is corrected there. The reversal date defaults to the current business date and its month must be open."
      tags: [accounting]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseJournalRequest" }
      responses:
