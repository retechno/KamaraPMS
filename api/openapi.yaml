        - $ref: "#/components/parameters/Cursor"
        - { name: owing, in: query, description: Only companies with a balance above zero., schema: { type: boolean } }
        - { name: q, in: query, description: Matches the code or the name., schema: { type: string } }
      responses:
        "200":
          description: A page of accounts, by company id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerAccountPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
