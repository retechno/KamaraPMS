              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelReservation
      summary: Cancel a reservation (reservation.cancel)
      description: |
        A reason is required. Rejected (409 `RESERVATION_HAS_STAYS`) once any room is checked in or completed. `requires_folio_resolution` is true when an open folio still has a balance (a deposit to refund, a fee to post).
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The result.
