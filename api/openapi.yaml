        from: { $ref: "#/components/schemas/Date" }
        to: { $ref: "#/components/schemas/Date" }
        taxes:
          type: array
          items: { $ref: "#/components/schemas/TaxReportLine" }
        service_charges:
          type: array
          items: { $ref: "#/components/schemas/TaxReportLine" }
        tax_total: { $ref: "#/components/schemas/Amount" }
        service_charge_total: { $ref: "#/components/schemas/Amount" }
    CashierReport:
      type: object
      required: [from, to, lines, by_method, net]
      properties:
        from: { $ref: "#/components/schemas/Date" }
        to: { $ref: "#/components/schemas/Date" }
        lines:
          type: array
          items:
            type: object
            required: [business_date, payment_method, payments, refunds, net, count, voided, voided_count]
            properties:
              business_date: { $ref: "#/components/schemas/Date" }
              payment_method: { type: string }
              payments: { $ref: "#/components/schemas/Amount" }
              refunds: { $ref: "#/components/schemas/Amount" }
              net: { $ref: "#/components/schemas/Amount" }
              count: { type: integer }
              voided: { $ref: "#/components/schemas/Amount" }
              voided_count: { type: integer }
        by_method:
          type: array
          items:
            type: object
            required: [payment_method, payments, refunds, net]
            properties:
              payment_method: { type: string }
              payments: { $ref: "#/components/schemas/Amount" }
              refunds: { $ref: "#/components/schemas/Amount" }
              net: { $ref: "#/components/schemas/Amount" }
        net: { $ref: "#/components/schemas/Amount" }
    StatisticsDay:
      type: object
      required: [business_date, rooms_total, rooms_out_of_order, rooms_sellable, rooms_occupied, room_nights_sold, arrivals, departures, no_shows, room_revenue, occupancy_percent, adr, revpar]
      properties:
        business_date: { $ref: "#/components/schemas/Date" }
        rooms_total: { type: integer }
        rooms_out_of_order: { type: integer }
        rooms_sellable: { type: integer }
        rooms_occupied: { type: integer }
        room_nights_sold: { type: integer }
        arrivals: { type: integer }
        departures: { type: integer }
        no_shows: { type: integer }
        room_revenue: { $ref: "#/components/schemas/Amount" }
        occupancy_percent: { type: string }
        adr: { $ref: "#/components/schemas/Amount" }
        revpar: { $ref: "#/components/schemas/Amount" }
    StatisticsTotals:
      type: object
      required: [days, available_room_nights, occupied_room_nights, room_nights_sold, room_revenue, occupancy_percent, adr, revpar]
      properties:
        days: { type: integer }
        available_room_nights: { type: integer }
        occupied_room_nights: { type: integer }
        room_nights_sold: { type: integer }
        room_revenue: { $ref: "#/components/schemas/Amount" }
        occupancy_percent: { type: string }
        adr: { $ref: "#/components/schemas/Amount" }
        revpar: { $ref: "#/components/schemas/Amount" }
    StatisticsReport:
      type: object
      required: [from, to, days, totals]
      properties:
        from: { $ref: "#/components/schemas/Date" }
        to: { $ref: "#/components/schemas/Date" }
        days:
          type: array
          items: { $ref: "#/components/schemas/StatisticsDay" }
        totals: { $ref: "#/components/schemas/StatisticsTotals" }
    Dashboard:
      type: object
      required: [business_date, today, movements, rooms, trend, month_to_date, previous_month, forecast]
      properties:
        business_date: { $ref: "#/components/schemas/Date" }
        today:
          description: The open day computed live (the closing summary it will get).
          oneOf:
            - { $ref: "#/components/schemas/NightAuditSummary" }
            - { type: "null" }
        movements:
          type: object
          required: [arrivals_expected, arrivals_checked_in, departures_expected, departures_checked_out, in_house, in_house_balance]
          properties:
            arrivals_expected: { type: integer, description: Rooms arriving today that are not checked in yet. }
            arrivals_checked_in: { type: integer }
            departures_expected: { type: integer, description: Stays leaving today that are still open. }
            departures_checked_out: { type: integer }
            in_house: { type: integer }
            in_house_balance: { $ref: "#/components/schemas/Amount", description: What the stays in house owe on their folios now. }
        rooms:
          type: object
          required: [clean, dirty, cleaning, inspected]
          description: Active rooms by housekeeping status.
          properties:
            clean: { type: integer }
            dirty: { type: integer }
            cleaning: { type: integer }
            inspected: { type: integer }
        trend:
          type: array
          description: The last 14 closed days, oldest first.
          items: { $ref: "#/components/schemas/StatisticsDay" }
        month_to_date: { $ref: "#/components/schemas/StatisticsTotals", description: The closed days of the current month. }
        previous_month: { $ref: "#/components/schemas/StatisticsTotals", description: The same number of days of the month before. }
        forecast:
          type: array
          description: The next 14 nights, today first.
          items:
            type: object
            required: [date, rooms_sellable, rooms_booked, occupancy_percent]
            properties:
              date: { $ref: "#/components/schemas/Date" }
              rooms_sellable: { type: integer }
              rooms_booked: { type: integer, description: Rooms held by confirmed reservations and open stays. }
              occupancy_percent: { type: string }
    StayListReport:
      type: object
      required: [rows]
      properties:
        date: { $ref: "#/components/schemas/Date" }
        rows:
          type: array
          items:
            type: object
            required: [stay_id, stay_number, confirmation_number, guest, arrival_date, departure_date, adult_count, child_count, balance]
            properties:
              stay_id: { type: integer, format: int64 }
              stay_number: { type: string }
              status: { type: string }
              confirmation_number: { type: string }
              guest: { type: string }
              room: { type: string }
              arrival_date: { $ref: "#/components/schemas/Date" }
              departure_date: { $ref: "#/components/schemas/Date" }
              adult_count: { type: integer }
              child_count: { type: integer }
              balance: { $ref: "#/components/schemas/Amount" }
    ArrivalsReport:
      type: object
      required: [date, rows]
      properties:
        date: { $ref: "#/components/schemas/Date" }
        rows:
          type: array
          items:
            type: object
            required: [reservation_room_id, confirmation_number, status, guest, room_type, arrival_date, departure_date, adult_count, child_count]
            properties:
              reservation_room_id: { type: integer, format: int64 }
              confirmation_number: { type: string }
              status: { type: string }
              guest: { type: string }
              room_type: { type: string }
              room: { type: string }
              arrival_date: { $ref: "#/components/schemas/Date" }
              departure_date: { $ref: "#/components/schemas/Date" }
              adult_count: { type: integer }
              child_count: { type: integer }
    AuditLog:
      type: object
      required: [id, created_at, business_date, user, action, entity_type, entity_id, old_data, new_data]
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        business_date:
          oneOf:
            - { $ref: "#/components/schemas/Date" }
            - { type: "null" }
        user:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: integer, format: int64 }
                name: { type: string }
            - { type: "null" }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: integer, format: int64 }
        old_data: { description: The state before (null for a creation). }
        new_data: { description: The state after. }
        request_id: { type: string }
        ip_address: { type: string }
    AuditLogPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditLog" }
        next_cursor: { type: string }
    EmailEntry:
      type: object
      required: [id, kind, to, status, attempts, sent_at, created_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [RESERVATION_CONFIRMATION] }
        to: { type: string }
        status: { type: string, enum: [QUEUED, SENT, FAILED, SKIPPED], description: "QUEUED: waiting or being retried; FAILED: given up after five attempts or refused; SKIPPED: the reservation was no longer confirmed." }
        attempts: { type: integer }
        last_error: { type: string }
        sent_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ReservationEmails:
      type: object
      required: [enabled, data]
      properties:
        enabled: { type: boolean, description: False when the server has no mail server configured. }
        data:
          type: array
          items: { $ref: "#/components/schemas/EmailEntry" }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, examples: ["urn:kamarapms:problem:ROOM_NOT_AVAILABLE"] }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable error code.
          examples: [ROOM_NOT_AVAILABLE, VERSION_CONFLICT, RESOURCE_BUSY]
        detail: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        context:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
          description: The same request may succeed if retried (temporary contention).
        request_id: { type: string }
    Company:
      type: object
      required: [id, code, name, credit_limit, payment_terms_days, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        contact_name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        tax_id: { type: string }
        credit_limit: { type: [string, "null"], description: "null: no limit; \"0\": no credit." }
        payment_terms_days: { type: integer }
        notes: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanyPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Company" }
        next_cursor: { type: string }
    CreateCompanyRequest:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, description: "1-20 characters: A-Z, 0-9, - or _ (upper-cased)." }
        name: { type: string, maxLength: 150 }
        contact_name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        tax_id: { type: string }
        credit_limit: { type: string, description: Empty for no limit. At most the currency's decimals. }
        payment_terms_days: { type: integer, minimum: 0, maximum: 365, default: 30 }
        notes: { type: string }
        is_active: { type: boolean, default: true }
    PatchCompanyRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        contact_name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        tax_id: { type: string }
        credit_limit: { type: string, description: Empty removes the limit. }
        payment_terms_days: { type: integer, minimum: 0, maximum: 365 }
        notes: { type: string }
        is_active: { type: boolean }
    Group:
      type: object
      required: [id, code, name, company_id, arrival_date, departure_date, is_active, reservation_count, room_count, created_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        company_id: { type: [integer, "null"], format: int64 }
        company_name: { type: string }
        contact_name: { type: string }
        contact_email: { type: string }
        contact_phone: { type: string }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
        notes: { type: string }
        is_active: { type: boolean }
        reservation_count: { type: integer, description: Reservations that are not cancelled. }
        room_count: { type: integer, description: Rooms that are not cancelled. }
        created_at: { type: string, format: date-time }
    GroupPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Group" }
        next_cursor: { type: string }
    CreateGroupRequest:
      type: object
      required: [code, name, arrival_date, departure_date]
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string, maxLength: 150 }
        company_id: { type: [integer, "null"], format: int64 }
        contact_name: { type: string }
        contact_email: { type: string }
        contact_phone: { type: string }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
        notes: { type: string }
        is_active: { type: boolean, default: true }
    PatchGroupRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        company_id: { type: integer, format: int64, description: Below 1 removes the company. }
        contact_name: { type: string }
        contact_email: { type: string }
        contact_phone: { type: string }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
        notes: { type: string }
        is_active: { type: boolean }
    GroupMember:
      type: object
      required: [reservation_id, confirmation_number, status, company_id, arrival_date, departure_date, room_count]
      properties:
        reservation_id: { type: integer, format: int64 }
        confirmation_number: { type: string }
        status: { type: string, enum: [DRAFT, CONFIRMED, CANCELLED] }
        guest_name: { type: string }
        company_id: { type: [integer, "null"], format: int64 }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
        room_count: { type: integer }
    GroupMemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
    TransferRequest:
      type: object
      required: [company_id, amount]
      additionalProperties: false
      properties:
        company_id: { type: integer, format: int64 }
        amount: { type: string }
        reference_number: { type: string, maxLength: 100 }
        remarks: { type: string, maxLength: 500 }
    ReceiveRequest:
      type: object
      required: [amount, payment_method]
      additionalProperties: false
      properties:
        amount: { type: string }
        payment_method: { type: string, enum: [CASH, CARD, BANK_TRANSFER, OTHER] }
        reference_number: { type: string, maxLength: 100 }
        remarks: { type: string, maxLength: 500 }
        allocations:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ReceiptAllocationRequest" }
    ReceiptAllocationRequest:
      type: object
      required: [invoice_id, amount]
      additionalProperties: false
      properties:
        invoice_id: { type: integer, format: int64 }
        amount: { type: string }
    ReceiptAllocation:
      type: object
      required: [invoice_id, invoice_number, amount]
      properties:
        invoice_id: { type: integer, format: int64 }
        invoice_number: { type: string }
        amount: { type: string }
    CityLedgerAccount:
      type: object
      required: [company_id, code, name, is_active, credit_limit, payment_terms_days, transferred, received, balance, available]
      properties:
        company_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        is_active: { type: boolean }
        credit_limit: { type: [string, "null"] }
        payment_terms_days: { type: integer }
        transferred: { type: string, description: Posted transfers from folios. }
        received: { type: string, description: Posted receipts. }
        balance: { type: string, description: transferred minus received. }
        available: { type: [string, "null"], description: What can still be transferred within the limit; null without a limit. }
    CityLedgerAccountPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CityLedgerAccount" }
        next_cursor: { type: string }
    CityLedgerReceipt:
      type: object
      required: [id, receipt_number, company_id, amount, payment_method, business_date, paid_at, status, voided_at, created_by, approved_by, allocations]
      properties:
        id: { type: integer, format: int64 }
        receipt_number: { type: string }
        company_id: { type: integer, format: int64 }
        amount: { type: string }
        payment_method: { type: string, enum: [CASH, CARD, BANK_TRANSFER, OTHER] }
        reference_number: { type: string }
        remarks: { type: string }
        business_date: { $ref: "#/components/schemas/Date" }
        paid_at: { type: string, format: date-time }
        status: { type: string, enum: [POSTED, VOIDED] }
        voided_at: { type: [string, "null"], format: date-time }
        void_reason: { type: string }
        created_by: { type: [integer, "null"], format: int64 }
        approved_by: { type: [integer, "null"], format: int64 }
        allocations:
          type: array
          description: The invoices this receipt pays (also on a voided receipt, where they no longer count).
          items: { $ref: "#/components/schemas/ReceiptAllocation" }
    CityLedgerReceiptResult:
      type: object
      required: [receipt, balance]
      properties:
        receipt: { $ref: "#/components/schemas/CityLedgerReceipt" }
        balance: { type: string, description: The company's balance after the receipt or void. }
    CityLedgerReceiptList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CityLedgerReceipt" }
    CityLedgerStatementLine:
      type: object
      required: [date, kind, number, description, status, debit, credit, balance]
      properties:
        date: { $ref: "#/components/schemas/Date" }
        kind: { type: string, enum: [TRANSFER, RECEIPT] }
        number: { type: string }
        description: { type: string }
        reference: { type: string }
        status: { type: string, enum: [POSTED, VOIDED] }
        debit: { type: string }
        credit: { type: string }
        balance: { type: string, description: The running balance of the posted lines. }
        folio_number: { type: string }
        confirmation_number: { type: string }
        guest_name: { type: string }
    CityLedgerStatement:
      type: object
      required: [company, from, to, opening_balance, total_debit, total_credit, closing_balance, lines]
      properties:
        company: { $ref: "#/components/schemas/CityLedgerAccount" }
        from: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        to: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        opening_balance: { type: string }
        total_debit: { type: string }
        total_credit: { type: string }
        closing_balance: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CityLedgerStatementLine" }
    CityLedgerAging:
      type: object
      required: [as_of, total, buckets]
      properties:
        as_of: { $ref: "#/components/schemas/Date" }
        total: { type: string }
        buckets:
          type: array
          items:
            type: object
            required: [label, amount]
            properties:
              label: { type: string, enum: ["0-30", "31-60", "61-90", "90+"] }
              amount: { type: string }
    CityLedgerInvoiceLine:
      type: object
      required: [payment_id, payment_number, business_date, folio_number, confirmation_number, arrival_date, departure_date, checked_out_at, amount]
      properties:
        payment_id: { type: integer, format: int64, description: The transfer. }
        payment_number: { type: string }
        business_date: { $ref: "#/components/schemas/Date" }
        folio_number: { type: string }
        confirmation_number: { type: string }
        stay_number: { type: string }
        guest_name: { type: string }
        room_numbers: { type: string, description: The rooms of the stay, in the order it used them. }
        arrival_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        departure_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        checked_out_at: { type: [string, "null"], format: date-time }
        reference_number: { type: string }
        amount: { type: string }
