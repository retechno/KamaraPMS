      summary: List charge codes with their active rules
      tags: [billing-config]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: active, in: query, schema: { type: boolean } }
        - { name: charge_type, in: query, schema: { $ref: "#/components/schemas/ChargeType" } }
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeCodePage" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createChargeCode
      summary: Create a charge code without rules (billing_config.manage)
      description: Every property starts with ten system codes (ROOM, ROOM_EXEMPT, BREAKFAST, RESTAURANT, LAUNDRY, MINIBAR, EXTRA_BED, NO_SHOW_FEE, CANCEL_FEE, OTHER) and no rules.
      tags: [billing-config]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChargeCodeRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeCode" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/charge-codes/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getChargeCode
      summary: A charge code with its ordered rules
      tags: [billing-config]
      responses:
        "200":
          description: The charge code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeCode" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateChargeCode
      summary: Edit a charge code (billing_config.manage); the code cannot change
      description: "`price_mode` is immutable once the code is used by a rate plan, a nightly rate or a folio item (409 `PRICE_MODE_LOCKED`). The charge type of a system code is fixed (409 `SYSTEM_CHARGE_CODE_LOCKED`). Deactivation is 409 `CHARGE_CODE_IN_USE` while an active rate plan sells through the code. An empty `default_unit_price` clears it."
      tags: [billing-config]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchChargeCodeRequest" }
      responses:
        "200":
          description: The updated resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeCode" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/charge-codes/{id}/rules:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    put:
      operationId: replaceChargeCodeRules
      summary: Replace the ordered tax and service rules of a charge code (billing_config.manage)
      description: |
        The request is the complete rule set. Rules that are no longer listed are deactivated (history is
        kept). Taxes and service charges must exist in the property (404 `TAX_NOT_FOUND`,
        `SERVICE_CHARGE_NOT_FOUND`) and be active (422 `TAX_INACTIVE`, `SERVICE_CHARGE_INACTIVE`).
        Sequences are unique per list and at least 1. Affects future postings only.
      tags: [billing-config]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceRulesRequest" }
      responses:
        "200":
          description: The charge code with its new rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeCode" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/charge-calculations:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      operationId: calculateCharge
      summary: Preview the charge calculation engine result (any access to the property)
      description: |
        Runs the Charge Calculation Engine for a charge code and returns the full breakdown. Nothing is
        posted or stored. The charge code's active, ordered rules and the property's currency precision are
        used; `price_mode` overrides the code's own mode.

        Amounts are signed: a negative `unit_price` (or `quantity`) calculates a credit, as adjustments do.
        `discount_amount` is a non-negative magnitude, at most the amount, with no more decimals than the
        currency; it always reduces the amount towards zero.

        Every line amount is rounded half away from zero at the currency precision. An inclusive price
        always totals exactly the quoted amount: any rounding residual is reported as `rounding_adjustment`
        and added to the net revenue, never to the service charge or tax.
      tags: [billing-config]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalculateChargeRequest" }
      responses:
        "200":
          description: The breakdown. Money uses the currency's decimals; rates use four.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargeCalculation" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/rate-plans:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listRatePlans
      summary: List rate plans
      tags: [rates]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: A page of rate plans.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RatePlanPage" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createRatePlan
      summary: Create a rate plan (rate.manage)
      description: "The room charge code must be an active charge code of type ROOM. It owns the tax and service rules and the price mode the grid amounts are read in."
      tags: [rates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRatePlanRequest" }
      responses:
        "201":
          description: The created rate plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RatePlan" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/rate-plans/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateRatePlan
      summary: Edit a rate plan (rate.manage); the code cannot change
      description: |
        Changing the room charge code affects nightly snapshots taken from now on; existing reservations keep
        theirs. A plan that already has rates cannot move to a room charge code with a different price mode
        (409 `RATE_PLAN_PRICE_MODE_MISMATCH`), because its amounts would silently be read differently.
        Deactivating a plan does not touch existing reservations.
      tags: [rates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchRatePlanRequest" }
      responses:
        "200":
          description: The updated rate plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RatePlan" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/yield-rules:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listYieldRules
      summary: List the yield rules in the order they apply
      description: "Yield rules adjust the price a night is sold at (see `POST` for the conditions). Readable by anyone at the property."
      tags: [rates]
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: The rules, lowest priority first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YieldRuleList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createYieldRule
      summary: Create a yield rule (rate.manage)
      description: |
        A rule matches a night when all its conditions hold (a condition left out always holds): rate plan, room type, stay dates, weekdays, how full the property is that night (`occupancy_from` included, `occupancy_to` excluded, except that 100 includes a full house), days between today and the night, and nights of the stay. Matching rules apply in `priority` order (then oldest first), each to the price the one before left, by a percentage (above -100, at most 1000) or an amount, kept within the rule's own `floor_amount` and `cap_amount`, never below zero and rounded at the currency's decimals.
        Rules price the nights of bookings made, amended or quoted from now on; a booking keeps the price it was sold at. A night with an override keeps the override. 409 `CODE_TAKEN`; 404 `RATE_PLAN_NOT_FOUND`, `ROOM_TYPE_NOT_FOUND`.
      tags: [rates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/YieldRuleRequest" }
      responses:
        "201":
          description: The created rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YieldRule" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/yield-rules/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getYieldRule
      summary: A yield rule
      tags: [rates]
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YieldRule" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateYieldRule
      summary: Replace a yield rule (rate.manage)
      description: "The body is the whole rule; the code must be the one it has. 404 `YIELD_RULE_NOT_FOUND`."
      tags: [rates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/YieldRuleRequest" }
      responses:
        "200":
          description: The updated rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YieldRule" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteYieldRule
      summary: Delete a yield rule (rate.manage)
      description: Reservations keep the codes of the rules that priced them.
      tags: [rates]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/rate-quotes:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getRateQuote
      summary: What a stay would be priced at today, rule by rule
      description: "Prices a stay as a booking made now would be: per night the grid price, how full the property is, each rule that moved the price and the price the night is sold at. Nights without a grid price are counted in `missing_nights` and carry no price. Readable by anyone at the property."
      tags: [rates]
      parameters:
        - { name: rate_plan_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: room_type_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: arrival_date, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: departure_date, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateQuote" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/rates:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getRates
      summary: The rate grid of a plan for [from, to), with the plan's price mode
      description: "`from` and `to` are required; `to` is exclusive and the span is at most 730 days. The list is not paginated. Nights without a rate are simply absent."
      tags: [rates]
      parameters:
        - { name: rate_plan_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: room_type_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The grid slice, ordered by night then room type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateGrid" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    put:
      operationId: fillRates
      summary: Bulk upsert one amount over a date range (rate.manage)
      description: |
        Sets `amount` for every listed room type on every night of [from, to) that falls on one of
        `weekdays` (all days when omitted). The amount is read in the plan's price mode, is not negative and
        has at most the currency's decimals (two at most). The whole request succeeds or nothing is written.
        Existing reservations are not affected: they hold their own nightly snapshots.
      tags: [rates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FillRatesRequest" }
      responses:
        "200":
          description: How many nights were written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FillRatesResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/availability:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: searchAvailability
      summary: Availability per room type and night, with rate plan prices (reservation.read)
      description: |
        Advisory: only booking decides. `arrival` must not be before the business date, `departure` is after
        arrival, at most 365 nights. `available` is `sellable - demand` and never negative. A rate plan with
        nights that have no rate is listed with `missing_nights` and no `estimate`.
      tags: [reservations]
      parameters:
        - { name: arrival, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: departure, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: adults, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: children, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: The search result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilitySearch" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/availability/rooms:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listFreeRooms
      summary: Free specific rooms of a room type for [arrival, departure) (reservation.read)
      tags: [reservations]
      parameters:
        - { name: room_type_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: arrival, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: departure, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
      responses:
        "200":
          description: The free rooms, with their housekeeping status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FreeRoom" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listReservations
      summary: Search reservations, newest first (reservation.read)
      description: "`arrival` and `departure` in the results are derived from the rooms that are not cancelled (from all rooms when every room is cancelled). `q` matches the confirmation number and the booker's name."
      tags: [reservations]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: arrival_from, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: arrival_to, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: company_id, in: query, schema: { type: integer, format: int64 } }
        - { name: booking_group_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, CONFIRMED, CANCELLED] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of reservations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createReservation
      summary: Create a draft reservation, optionally confirming it at once (reservation.create)
      description: |
        The `Idempotency-Key` header is required: the same key with the same body returns the stored
        reservation, the same key with another body is 422 `IDEMPOTENCY_KEY_REUSED`. Drafts hold no inventory.
        With `confirm: true` a booker is required and every room goes through the availability check (409
        `ROOM_TYPE_NOT_AVAILABLE` or `ROOM_NOT_AVAILABLE`); `room_id` is only accepted then, and must be a room
        of the booked type. Every night needs a grid price or a `nightly_overrides` entry (needs
        `reservation.override_rate`), otherwise 409 `RATE_NOT_SET`.
      tags: [reservations]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReservationRequest" }
      responses:
        "201":
          description: The reservation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getReservation
      summary: Reservation detail with rooms, nightly rates, estimates and folios (reservation.read)
      tags: [reservations]
      responses:
        "200":
          description: The reservation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateReservation
      summary: Edit header fields (reservation.update); needs the current version
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchReservationRequest" }
      responses:
        "200":
          description: The reservation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: confirmReservation
      summary: Confirm a draft reservation (reservation.create)
      description: |
        All draft rooms become CONFIRMED or none does. A booker is required. 409 `ROOM_TYPE_NOT_AVAILABLE` lists the failing nights in `context.nights`; 409 `ROOM_NOT_AVAILABLE` names the room and why.
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelReservation
      summary: Cancel a reservation (reservation.cancel)
      description: |
        A reason is required. Rejected (409 `RESERVATION_HAS_STAYS`) once any room is checked in or completed. `requires_folio_resolution` is true when an open folio still has a balance (a deposit to refund, a fee to post).
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/reinstate:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reinstateReservation
      summary: Reinstate a cancelled reservation (reservation.reinstate)
      description: |
        Only the rooms that were cancelled together with the reservation come back, if they arrive on or after the business date and the inventory still has room.
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/rooms:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addReservationRoom
      summary: Add a room to a draft or confirmed reservation (reservation.update)
      description: On a confirmed reservation the room is created CONFIRMED and goes through the availability check.
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddRoomRequest" }
      responses:
        "201":
          description: The reservation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/rooms/{lineId}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LineId"
    patch:
      operationId: updateReservationRoom
      summary: Amend a draft or confirmed room (reservation.update)
      description: |
        Availability is re-checked without the room's own demand. Nights that survive keep their price
        snapshot; changing the rate plan or room type prices every night again; new nights come from the
        grid. The room type cannot change while a room is assigned (409 `ROOM_ASSIGNED`).
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchReservationRoomRequest" }
      responses:
        "200":
          description: The reservation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/rooms/{lineId}/cancel:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LineId"
    post:
      operationId: cancelReservationRoom
      summary: Cancel one room (reservation.cancel)
      description: |
        The reservation is cancelled with its last room that is not cancelled.
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/rooms/{lineId}/no-show:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LineId"
    post:
      operationId: markReservationRoomNoShow
      summary: Mark a confirmed room as a no-show (nightaudit.no_show)
      description: |
        Only a CONFIRMED room whose arrival date has come (arrival on or before the business date). Releases its inventory.
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/rooms/{lineId}/assign-room:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LineId"
    post:
      operationId: assignReservationRoom
      summary: Assign a specific room (reservation.update)
      description: |
        A room of another type than the booked one is an upgrade: it needs `upgrade: true` and `reservation.upgrade`, and the room type of the room must have the inventory. The room must be free (409 `ROOM_NOT_AVAILABLE` with the reasons).
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignRoomRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/rooms/{lineId}/unassign-room:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LineId"
    post:
      operationId: unassignReservationRoom
      summary: Take the assigned room off (reservation.update)
      description: |
        The room goes back to consuming its booked room type, which must have the inventory when it was an upgrade.
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/tape-chart:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getTapeChart
      summary: Rooms with the bookings and blocks touching [from, to) (reservation.read)
      description: "Read-only. The window is at most 62 days. Rows are the active rooms; CONFIRMED and CHECKED_IN room lines without a specific room are listed per room type under `unassigned`."
      tags: [reservations]
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
      responses:
        "200":
          description: The chart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TapeChart" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listFolios
      summary: List folios with their balances (folio.read)
      tags: [folios]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: reservation_id, in: query, schema: { type: integer, format: int64 } }
        - { name: stay_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED] } }
      responses:
        "200":
          description: A page of folios.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolioPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getFolio
      summary: A folio with its ledger items and components (folio.read)
      description: "`balance` is debits minus credits; it is never stored. Amounts are formatted with the property's currency decimals."
      tags: [folios]
      responses:
        "200":
          description: The folio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folio" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}/charges:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postFolioCharge
      summary: Post a manual charge (folio.post_charge)
      description: |
        The breakdown comes only from the charge calculation engine. A charge code of type ROOM is refused (409 `ROOM_CHARGE_REQUIRES_ROOM_POSTING`). `unit_price` falls back to the charge code's default price. The folio must be OPEN. The same Idempotency-Key replays the stored item.
      tags: [folios]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostChargeRequest" }
      responses:
        "201":
          description: The item and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}/adjustments:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postFolioAdjustment
      summary: Post a signed adjustment on the current business date (folio.adjust, needs approval)
      description: |
        Needs the `approval` block (docs 06-api.md §14.1). The engine runs on a signed amount, so taxes and service charges follow the sign. A replay of the same Idempotency-Key returns the stored item and does not ask for approval again.
      tags: [folios]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostAdjustmentRequest" }
      responses:
        "201":
          description: The item and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}/payments:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postFolioPayment
      summary: Take a payment (payment.post)
      tags: [folios]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostPaymentRequest" }
      responses:
        "201":
          description: The payment, its ledger entry and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folios/{id}/close:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: closeFolio
      summary: Close a folio with a zero balance (folio.post_charge)
      description: For folios that never got a stay. A folio linked to an OPEN stay closes with the check-out (409 `FOLIO_LINKED_TO_OPEN_STAY`). Every posting bumps the folio's version, so a stale screen gets 409 `VERSION_CONFLICT`.
      tags: [folios]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200":
          description: The closed folio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folio" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/folio-items/{id}/reverse:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reverseFolioItem
      summary: Reverse an item posted on the current business date (folio.reverse, needs approval)
      description: |
        Debit and credit are swapped and every signed column and component is negated. A payment is voided instead (409 `USE_PAYMENT_CORRECTION`); an item of an earlier date is corrected with an adjustment (409 `CORRECTION_REQUIRES_ADJUSTMENT`); an item is reversed once (409 `ALREADY_REVERSED`).
      tags: [folios]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionRequest" }
      responses:
        "201":
          description: The reversal item and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reservations/{id}/deposits:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postDeposit
      summary: Take a deposit on a draft or confirmed reservation (payment.post)
      description: The payment goes on the reservation's open folio that is not linked to a stay; the first deposit creates it.
      tags: [folios]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostPaymentRequest" }
      responses:
        "201":
          description: The payment, its ledger entry and the folio's balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/payments:
