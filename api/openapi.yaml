openapi: 3.1.0
info:
  title: KamaraPMS API
  version: 0.14.0
  description: |
    REST API of the KamaraPMS property management system.
    Contract reference: docs/architecture/06-api.md. This file grows with each milestone
    and is the source of the generated TypeScript client (web/src/api/schema.d.ts).

    Conventions: errors are RFC 9457 `application/problem+json` with a stable `code`;
    money is a decimal string; business dates are `YYYY-MM-DD`; instants are RFC 3339 UTC.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe (never checks dependencies)
      tags: [system]
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe (checks the database)
      tags: [system]
      security: []
      responses:
        "200":
          description: The API can serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in (sets the httpOnly refresh cookie)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. The refresh token is set as the httpOnly cookie pms_refresh (Path=/api/v1/auth).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Exchange the refresh cookie for a new access token (rotates the cookie)
      tags: [auth]
      security: []
      responses:
        "200":
          description: A new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the session identified by the refresh cookie
      tags: [auth]
      security: []
      responses:
        "204": { description: Signed out; the cookie is cleared. }
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: The caller, their tenant, and their permissions per property
      tags: [auth]
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the caller's password (ends their other sessions)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed. }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/permissions:
    get:
      operationId: listPermissions
      summary: The permission catalogue
      tags: [access]
      responses:
        "200":
          description: All permissions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PermissionInfo" }
  /api/v1/users:
    get:
      operationId: listUsers
      summary: Users of the tenant (tenant administrators)
      tags: [access]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createUser
      summary: Create a user (tenant administrators)
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getUser
      summary: A user with their property grants
      tags: [access]
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateUser
      summary: Rename, activate/deactivate, or change the administrator flag
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{userId}/properties:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: replaceUserGrants
      summary: Replace the user's property grants (one role per property)
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grants]
              additionalProperties: false
              properties:
                grants:
                  type: array
                  items: { $ref: "#/components/schemas/GrantInput" }
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{userId}/password:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: resetUserPassword
      summary: Set a user's password (ends all their sessions)
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 12 }
      responses:
        "204": { description: Password set. }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: Roles of the tenant
      tags: [access]
      responses:
        "200":
          description: All roles.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
    post:
      operationId: createRole
      summary: Create a role
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequest" }
      responses:
        "201":
          description: The role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/roles/{roleId}:
    parameters:
      - { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getRole
      summary: A role
      tags: [access]
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateRole
      summary: Rename a role or replace its permissions (effective on the next request)
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequest" }
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties:
    get:
      operationId: listProperties
      summary: Properties the caller can access
      tags: [properties]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of properties.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyPage" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProperty
      summary: Create a property (opens its first business day and document sequences)
      tags: [properties]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePropertyRequest" }
      responses:
        "201":
          description: The created property with its business date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyWithDay" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getProperty
      summary: Property details, settings and current business date
      tags: [properties]
      responses:
        "200":
          description: The property.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyWithDay" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProperty
      summary: Update property settings (currency is locked once financial transactions exist)
      tags: [properties]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchPropertyRequest" }
      responses:
        "200":
          description: The updated property.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyWithDay" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/business-date:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getBusinessDate
      summary: The property business date versus server and local time
      tags: [business-days]
      responses:
        "200":
          description: The business-date clock.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayClock" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/business-days:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listBusinessDays
      summary: Business-day history, newest first
      tags: [business-days]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of business days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDayPage" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/room-types:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listRoomTypes
      summary: List room types
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: active, in: query, schema: { type: boolean }, description: Only active or only inactive room types. }
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomTypePage" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createRoomType
      summary: Create a room type (room.manage)
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomTypeRequest" }
      responses:
        "201":
          description: The created room type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomType" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/room-types/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getRoomType
      summary: Room type details
      tags: [rooms]
      responses:
        "200":
          description: The room type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomType" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateRoomType
      summary: Edit a room type or deactivate it (room.manage). The code cannot change.
      description: |
        Deactivation is rejected with 409 `ROOM_TYPE_IN_USE` while active rooms of the type exist
        or future CONFIRMED reservation lines hold it.
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchRoomTypeRequest" }
      responses:
        "200":
          description: The updated room type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomType" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/rooms:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listRooms
      summary: List rooms
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: room_type_id, in: query, schema: { type: integer, format: int64 } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomPage" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createRoom
      summary: Create a room and its housekeeping state (room.manage)
      description: "The housekeeping status starts as `initial_housekeeping_status` (default DIRTY); no log entry is written."
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomRequest" }
      responses:
        "201":
          description: The created room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/rooms/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getRoom
      summary: Room details
      tags: [rooms]
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateRoom
      summary: Edit a room, change its type or deactivate it (room.manage)
      description: |
        Changing the type or deactivating is rejected with 409 `ROOM_IN_USE` (with `context.conflicts`)
        while a stay occupies the room or a CONFIRMED reservation line is assigned to it from the business date on.
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchRoomRequest" }
      responses:
        "200":
          description: The updated room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/room-blocks:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: listRoomBlocks
      summary: List OOO/OOS blocks, newest first
      tags: [room-blocks]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: room_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, CANCELLED] } }
        - { name: from, in: query, schema: { $ref: "#/components/schemas/Date" }, description: Blocks that end after this date. }
        - { name: to, in: query, schema: { $ref: "#/components/schemas/Date" }, description: Blocks that start before this date. }
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomBlockPage" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createRoomBlock
      summary: Take a room out of order (OOO) or out of service (OOS) (room_block.manage)
      description: |
        Both types make the room unsellable for the half-open range [start_date, end_date).
        Rejected with 409 `ROOM_BLOCK_CONFLICT` when an active block overlaps, or (with `context.conflicts`)
        when a stay or a CONFIRMED assigned reservation line holds the room in the range.
      tags: [room-blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomBlockRequest" }
      responses:
        "201":
          description: The block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomBlock" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/room-blocks/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getRoomBlock
      summary: Block details
      tags: [room-blocks]
      responses:
        "200":
          description: The block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomBlock" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateRoomBlock
      summary: Change the dates or reason of an active block, or release it early (room_block.manage)
      description: The new end_date must not be before the business date. Added nights are re-checked for conflicts.
      tags: [room-blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchRoomBlockRequest" }
      responses:
        "200":
          description: The updated block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomBlock" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/room-blocks/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelRoomBlock
      summary: Cancel a block (room_block.manage)
      tags: [room-blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRoomBlockRequest" }
      responses:
        "200":
          description: The cancelled block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomBlock" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/housekeeping:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getHousekeepingBoard
      summary: Housekeeping board with derived occupancy (all active rooms, not paginated)
      tags: [housekeeping]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/HousekeepingStatus" } }
        - { name: floor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Active rooms ordered by floor and number. `next_cursor` is never set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingBoard" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/rooms/{id}/housekeeping:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: setRoomHousekeeping
      summary: Change a room's housekeeping status (housekeeping.update; INSPECTED needs housekeeping.inspect)
      description: |
        Legal transitions: DIRTY→CLEANING→CLEAN→INSPECTED, DIRTY→CLEAN and any→DIRTY.
        Anything else is 409 `INVALID_HK_TRANSITION` with `context.allowed`. Every change writes a log entry.
      tags: [housekeeping]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetHousekeepingRequest" }
      responses:
        "200":
          description: The new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingState" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/rooms/{id}/housekeeping/logs:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listRoomHousekeepingLogs
      summary: A room's housekeeping history, newest first
      tags: [housekeeping]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HousekeepingLogPage" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/guests:
    get:
      operationId: searchGuests
      summary: Search guest profiles (guest.read), alphabetically
      description: |
        Free text; every space-separated token must match the start of the first name, last name, email,
        ID number or guest code, or appear inside the phone number (tokens with at least 4 digits).
        An empty `q` lists everything the caller may see.

        Visibility: a guest is visible when the caller holds `guest.search_all` (tenant-wide) or the guest is
        linked to a property where the caller holds `guest.read` (origin property, reservation booker or
        occupant, stay primary or accompanying guest). With `property_id`, only permissions at that property count.
        A guest the caller cannot see behaves as if it did not exist (404 `GUEST_NOT_FOUND`).
      tags: [guests]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: property_id, in: query, schema: { type: integer, format: int64 } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of guests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createGuest
      summary: Create a guest profile (guest.write at the origin property)
      description: |
        The code (GST000001, ...) is generated from a gapless tenant-wide series. Possible duplicates
        (same email, phone digits, ID document, or name and birth date) are a warning only: the profile is
        always created. Look-alikes the caller may not see are only counted.
      tags: [guests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGuestRequest" }
      responses:
        "201":
          description: The guest with duplicate hints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedGuest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/guests/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getGuest
      summary: A guest profile (guest.read), with whether the caller may edit it
      tags: [guests]
      responses:
        "200":
          description: The guest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestView" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateGuest
