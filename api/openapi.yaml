          application/json:
            schema: { $ref: "#/components/schemas/PatchGuestRequest" }
      responses:
        "200":
          description: The updated guest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestView" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/guests/{id}/history:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getGuestHistory
      summary: Reservations and stays of a guest across properties, newest first (guest.read)
      description: |
        Limited to properties where the caller holds `guest.read`, unless they hold
        `guest.history_all_properties`. `hidden_count` is the number of items left out.
      tags: [guests]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of history items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestHistory" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/taxes:
    parameters:
