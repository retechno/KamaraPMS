      required: [id, code, name, meal_plan, is_refundable, room_charge_code_id, room_charge_code, price_mode, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        meal_plan: { $ref: "#/components/schemas/MealPlan" }
        cancellation_policy: { type: string }
        is_refundable: { type: boolean }
        room_charge_code_id: { type: integer, format: int64 }
        room_charge_code: { type: string, description: Code of the room charge code. }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RatePlanPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RatePlan" }
        next_cursor: { type: string }
    CreateRatePlanRequest:
      type: object
      required: [code, name, meal_plan, room_charge_code_id]
