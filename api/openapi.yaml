        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json }, description: "csv answers a text/csv file; text that could be read as a spreadsheet formula is prefixed with an apostrophe." }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxReport" }
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/reports/cashier:
