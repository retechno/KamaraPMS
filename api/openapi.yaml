      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCityLedgerAccount
      summary: One company's account (cityledger.read)
      tags: [city-ledger]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerAccount" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}/statement:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCityLedgerStatement
      summary: A company's movements with the running balance (cityledger.read)
      description: "`from` and `to` are optional business dates (inclusive). A period that starts after earlier movements opens with their balance. Lines are ordered by date, transfers before receipts; a voided line is listed but does not move the balance."
      tags: [city-ledger]
      parameters:
        - { name: from, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: to, in: query, schema: { $ref: "#/components/schemas/Date" } }
      responses:
        "200":
          description: The statement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerStatement" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}/aging:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCityLedgerAging
      summary: What a company owes by age of the transfer (cityledger.read)
      description: As of the current business date, in the buckets 0-30, 31-60, 61-90 and 90+ days. Receipts settle the oldest transfers first.
      tags: [city-ledger]
      responses:
        "200":
          description: The aging.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerAging" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}/receipts:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listCityLedgerReceipts
      summary: A company's receipts, oldest first (cityledger.read)
      description: Not paginated.
      tags: [city-ledger]
      responses:
        "200":
          description: The receipts, voided ones included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerReceiptList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: receiveCityLedgerPayment
      summary: Record money a company paid against its account (cityledger.receive)
      description: |
        The receipt cannot exceed what the company owes (409 `RECEIPT_EXCEEDS_BALANCE`, with `context.balance`); the
        company row is locked, so receipts taken at once cannot exceed it together. The receipt number comes from the
        CITY_LEDGER_RECEIPT series. `allocations` pay invoices of the company with this receipt (the sum is at most the
        amount; what is left stays on account): each invoice must be an issued invoice of the company (404
        `INVOICE_NOT_FOUND`, 409 `INVOICE_NOT_PAYABLE`) and may not be paid more than it still owes (409
        `ALLOCATION_EXCEEDS_INVOICE`, with `context.invoice_id` and `context.outstanding`).
      tags: [city-ledger]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiveRequest" }
      responses:
        "201":
          description: The receipt and the account's balance after it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerReceiptResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/receipts/{id}/void:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: voidCityLedgerReceipt
      summary: Void a receipt taken on the current business date (cityledger.receive, needs approval)
      tags: [city-ledger]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionRequest" }
      responses:
        "200":
          description: The voided receipt and the account's balance after it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerReceiptResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}/invoice-candidates:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listCityLedgerInvoiceCandidates
      summary: Transfers of a company that are not on an invoice yet (cityledger.read)
      description: "Oldest first. `invoiceable` is true once the guest of the folio has checked out; transfers of guests still in house are listed but cannot be invoiced. Not paginated."
      tags: [city-ledger]
      responses:
        "200":
          description: The transfers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerCandidateList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/accounts/{id}/invoices:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listCityLedgerInvoices
      summary: A company's invoices, newest first, without their lines (cityledger.read)
      description: Not paginated. Voided invoices are listed.
      tags: [city-ledger]
      responses:
        "200":
          description: The invoices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerInvoiceList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCityLedgerInvoice
      summary: Issue one invoice over several transfers of a company (cityledger.invoice)
      description: |
        Combines the given transfers (at most 200) into one invoice. Every transfer must belong to the company, be
        posted, not be on another live invoice (409 `TRANSFER_NOT_AVAILABLE`) and belong to a guest who has checked out
        (409 `STAY_NOT_CHECKED_OUT`); both carry `context.payment_ids`. The due date is the invoice date plus the
        company's payment terms. The company row is locked, so two invoices cannot claim the same transfer. An invoice
        is a billing document: it does not change what the company owes.
      tags: [city-ledger]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCityLedgerInvoiceRequest" }
      responses:
        "201":
          description: The invoice with its lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerInvoice" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCityLedgerInvoice
      summary: One invoice with its lines (cityledger.read)
      tags: [city-ledger]
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerInvoice" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/invoices/{id}/void:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: voidCityLedgerInvoice
      summary: Void an invoice (cityledger.invoice, needs approval)
      description: Its transfers are released and can be invoiced again. 409 `INVOICE_ALREADY_VOIDED` for a voided invoice, 409 `INVOICE_HAS_PAYMENTS` while posted receipts have paid it (void them first).
      tags: [city-ledger]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionRequest" }
      responses:
        "200":
          description: The voided invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityLedgerInvoice" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/city-ledger/invoices/{id}/invoice.pdf:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCityLedgerInvoicePdf
      summary: Invoice to a company as a PDF (cityledger.read)
      description: "One line per checked-out stay (check-out date, guest, room, stay dates, folio, reference, amount), the total and the due date. A voided invoice is stamped VOID. File name `invoice-<invoice number>.pdf`."
      tags: [documents]
      responses:
        "200":
          description: The document as a PDF (never cached).
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /api/v1/auth/login or /api/v1/auth/refresh (15 minutes).
  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor.
      schema: { type: string }
  responses:
    Problem:
      description: An error, described as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    LoginRequest:
      type: object
      required: [tenant_code, email, password]
      additionalProperties: false
      properties:
        tenant_code: { type: string }
        email: { type: string }
        password: { type: string }
    Session:
      type: object
      required: [access_token, token_type, expires_in, expires_at, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 12 }
    Grant:
      type: object
      required: [property_id, property_code, property_name, role_id, role_name]
      properties:
        property_id: { type: integer, format: int64 }
        property_code: { type: string }
        property_name: { type: string }
        role_id: { type: integer, format: int64 }
        role_name: { type: string }
    GrantInput:
      type: object
      required: [property_id, role_id]
      additionalProperties: false
      properties:
        property_id: { type: integer, format: int64 }
        role_id: { type: integer, format: int64 }
    User:
      type: object
      required: [id, email, full_name, is_tenant_admin, is_active, created_at, grants]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        full_name: { type: string }
        is_tenant_admin: { type: boolean }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
    UserPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: string }
    CreateUserRequest:
      type: object
      required: [email, full_name, password]
      additionalProperties: false
      properties:
        email: { type: string }
        full_name: { type: string }
        password: { type: string, minLength: 12 }
        is_tenant_admin: { type: boolean, default: false }
        grants:
          type: array
          items: { $ref: "#/components/schemas/GrantInput" }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        full_name: { type: string }
        is_active: { type: boolean }
        is_tenant_admin: { type: boolean }
    PermissionInfo:
      type: object
      required: [code, group, description, milestone]
      properties:
        code: { type: string }
        group: { type: string }
        description: { type: string }
        milestone: { type: string }
    Role:
      type: object
      required: [id, name, is_system, permissions, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
    Me:
      type: object
      required: [user, tenant, properties]
      properties:
        user: { $ref: "#/components/schemas/User" }
        tenant:
          type: object
          required: [id, code, name]
          properties:
            id: { type: integer, format: int64 }
            code: { type: string }
            name: { type: string }
        properties:
          type: array
          items:
            type: object
            required: [id, code, name, role, permissions]
            properties:
              id: { type: integer, format: int64 }
              code: { type: string }
              name: { type: string }
              role: { type: string }
              permissions:
                type: array
                items: { type: string }
    Date:
      type: string
      format: date
      description: Calendar/business date (YYYY-MM-DD), never shifted by time zones.
      examples: ["2026-09-30"]
    TimeOfDay:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples: ["14:00"]
    PropertySettings:
      type: object
      required: [name, timezone, currency_code, currency_decimals, check_in_time, check_out_time,
                 require_room_inspection_for_checkin, night_audit_marks_occupied_dirty, night_audit_earliest_time]
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        country_code: { type: string, description: ISO 3166-1 alpha-2 }
        phone: { type: string, maxLength: 40, description: Printed on documents. }
        email: { type: string, maxLength: 254, description: Printed on documents. }
        tax_id: { type: string, maxLength: 40, description: "Tax registration number printed on invoices (for example NPWP)." }
        document_footer: { type: string, maxLength: 500, description: A line printed at the foot of every document. }
        timezone: { type: string, description: IANA time zone, examples: [Asia/Jakarta] }
        currency_code: { type: string, description: ISO 4217, examples: [IDR] }
        currency_decimals: { type: integer, minimum: 0, maximum: 3 }
        check_in_time: { $ref: "#/components/schemas/TimeOfDay" }
        check_out_time: { $ref: "#/components/schemas/TimeOfDay" }
        require_room_inspection_for_checkin: { type: boolean }
        night_audit_marks_occupied_dirty: { type: boolean }
        night_audit_earliest_time: { $ref: "#/components/schemas/TimeOfDay" }
    Property:
      allOf:
        - $ref: "#/components/schemas/PropertySettings"
        - type: object
          required: [id, code, status, created_at, updated_at]
          properties:
            id: { type: integer, format: int64 }
            code: { type: string }
            status: { type: string, enum: [ACTIVE, INACTIVE] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PropertyWithDay:
      allOf:
        - $ref: "#/components/schemas/Property"
        - type: object
          required: [business_date]
          properties:
            business_date: { $ref: "#/components/schemas/Date" }
    PropertyPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Property" }
        next_cursor: { type: string }
    CreatePropertyRequest:
      type: object
      required: [code, name, timezone, currency_code, currency_decimals, check_in_time, check_out_time, opening_business_date]
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        country_code: { type: string }
        phone: { type: string, maxLength: 40, description: Printed on documents. }
        email: { type: string, maxLength: 254, description: Printed on documents. }
        tax_id: { type: string, maxLength: 40, description: "Tax registration number printed on invoices (for example NPWP)." }
        document_footer: { type: string, maxLength: 500, description: A line printed at the foot of every document. }
        timezone: { type: string }
        currency_code: { type: string }
        currency_decimals: { type: integer, minimum: 0, maximum: 3 }
        check_in_time: { $ref: "#/components/schemas/TimeOfDay" }
        check_out_time: { $ref: "#/components/schemas/TimeOfDay" }
        require_room_inspection_for_checkin: { type: boolean, default: false }
        night_audit_marks_occupied_dirty: { type: boolean, default: true }
        night_audit_earliest_time: { $ref: "#/components/schemas/TimeOfDay" }
        opening_business_date:
          $ref: "#/components/schemas/Date"
          description: The property's current local date or the day before.
    PatchPropertyRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        country_code: { type: string }
        phone: { type: string, maxLength: 40, description: Printed on documents. }
        email: { type: string, maxLength: 254, description: Printed on documents. }
        tax_id: { type: string, maxLength: 40, description: "Tax registration number printed on invoices (for example NPWP)." }
        document_footer: { type: string, maxLength: 500, description: A line printed at the foot of every document. }
        timezone: { type: string }
        currency_code: { type: string }
        currency_decimals: { type: integer, minimum: 0, maximum: 3 }
        check_in_time: { $ref: "#/components/schemas/TimeOfDay" }
        check_out_time: { $ref: "#/components/schemas/TimeOfDay" }
        require_room_inspection_for_checkin: { type: boolean }
        night_audit_marks_occupied_dirty: { type: boolean }
        night_audit_earliest_time: { $ref: "#/components/schemas/TimeOfDay" }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    DayClock:
      type: object
      required: [business_date, server_time, property_local_time, timezone, night_audit_allowed, night_audit_allowed_from, night_audit_overdue]
      properties:
        business_date: { $ref: "#/components/schemas/Date" }
        server_time: { type: string, format: date-time, description: Server time (UTC) }
        property_local_time: { type: string, description: "Server time in the property time zone (RFC 3339 with offset)" }
        timezone: { type: string }
        night_audit_allowed: { type: boolean }
        night_audit_allowed_from: { type: string, format: date-time }
        night_audit_overdue: { type: boolean, description: The local date is more than one day past the business date. }
    BusinessDay:
      type: object
      required: [business_date, status, opened_at]
      properties:
        business_date: { $ref: "#/components/schemas/Date" }
        status: { type: string, enum: [OPEN, CLOSED] }
        opened_at: { type: string, format: date-time }
        opened_by: { type: integer, format: int64 }
        closed_at: { type: string, format: date-time }
        closed_by: { type: integer, format: int64 }
        summary: { type: object, additionalProperties: true }
    BusinessDayPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/BusinessDay" }
        next_cursor: { type: string }
    RoomType:
      type: object
      required: [id, code, name, max_adult, max_child, max_occupancy, base_occupancy, sort_order, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        max_adult: { type: integer }
        max_child: { type: integer }
        max_occupancy: { type: integer, description: At most max_adult + max_child. }
        base_occupancy: { type: integer, description: At most max_occupancy. }
        sort_order: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoomTypePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RoomType" }
        next_cursor: { type: string }
    CreateRoomTypeRequest:
      type: object
      required: [code, name, max_adult, max_child, max_occupancy, base_occupancy]
      additionalProperties: false
      properties:
        code: { type: string, description: "1-20 characters, A-Z 0-9 - _ (upper-cased)." }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        max_adult: { type: integer, minimum: 1, maximum: 20 }
        max_child: { type: integer, minimum: 0, maximum: 20 }
        max_occupancy: { type: integer, minimum: 1, maximum: 40 }
        base_occupancy: { type: integer, minimum: 1, maximum: 40 }
        sort_order: { type: integer }
        is_active: { type: boolean, default: true }
    PatchRoomTypeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        max_adult: { type: integer, minimum: 1, maximum: 20 }
        max_child: { type: integer, minimum: 0, maximum: 20 }
        max_occupancy: { type: integer, minimum: 1, maximum: 40 }
        base_occupancy: { type: integer, minimum: 1, maximum: 40 }
        sort_order: { type: integer }
        is_active: { type: boolean }
    Room:
      type: object
      required: [id, room_type_id, room_number, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        room_type_id: { type: integer, format: int64 }
        room_number: { type: string }
        floor: { type: string }
        building: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoomPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Room" }
        next_cursor: { type: string }
    CreateRoomRequest:
      type: object
      required: [room_number, room_type_id]
      additionalProperties: false
      properties:
        room_number: { type: string, maxLength: 20 }
        room_type_id: { type: integer, format: int64 }
        floor: { type: string, maxLength: 10 }
        building: { type: string, maxLength: 50 }
        is_active: { type: boolean, default: true }
        initial_housekeeping_status: { $ref: "#/components/schemas/HousekeepingStatus" }
    PatchRoomRequest:
      type: object
      additionalProperties: false
      properties:
        room_number: { type: string, maxLength: 20 }
        room_type_id: { type: integer, format: int64 }
        floor: { type: string, maxLength: 10 }
        building: { type: string, maxLength: 50 }
        is_active: { type: boolean }
    BlockType:
      type: string
      enum: [OOO, OOS]
      description: Out of order or out of service. Both make the room unsellable.
    RoomBlock:
      type: object
      required: [id, room_id, block_type, start_date, end_date, reason, status, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        room_id: { type: integer, format: int64 }
        block_type: { $ref: "#/components/schemas/BlockType" }
        start_date: { $ref: "#/components/schemas/Date" }
        end_date: { $ref: "#/components/schemas/Date", description: Exclusive. }
        reason: { type: string }
        status: { type: string, enum: [ACTIVE, CANCELLED] }
        cancelled_at: { type: string, format: date-time }
        cancelled_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoomBlockPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RoomBlock" }
        next_cursor: { type: string }
    CreateRoomBlockRequest:
      type: object
      required: [room_id, block_type, start_date, end_date, reason]
      additionalProperties: false
      properties:
        room_id: { type: integer, format: int64 }
        block_type: { $ref: "#/components/schemas/BlockType" }
        start_date: { $ref: "#/components/schemas/Date", description: Not before the business date. }
        end_date: { $ref: "#/components/schemas/Date", description: Exclusive; after start_date. }
        reason: { type: string, maxLength: 500 }
    PatchRoomBlockRequest:
      type: object
      additionalProperties: false
      properties:
        start_date: { $ref: "#/components/schemas/Date" }
        end_date: { $ref: "#/components/schemas/Date" }
        reason: { type: string, maxLength: 500 }
    CancelRoomBlockRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    HousekeepingStatus:
      type: string
      enum: [DIRTY, CLEANING, CLEAN, INSPECTED]
    Occupancy:
      type: string
      enum: [OCCUPIED, RESERVED, VACANT]
      description: Derived from stays and reservations; never stored.
    HousekeepingBoardRoom:
      type: object
      required: [room_id, room_number, room_type_id, room_type_code, room_type_name, status, status_updated_at, occupancy, allowed_next]
      properties:
        room_id: { type: integer, format: int64 }
        room_number: { type: string }
        floor: { type: string }
        building: { type: string }
        room_type_id: { type: integer, format: int64 }
        room_type_code: { type: string }
        room_type_name: { type: string }
        status: { $ref: "#/components/schemas/HousekeepingStatus" }
        status_updated_at: { type: string, format: date-time }
        occupancy: { $ref: "#/components/schemas/Occupancy" }
        block:
          type: object
          description: The active block covering the business date.
          required: [type, end_date]
          properties:
            type: { $ref: "#/components/schemas/BlockType" }
            end_date: { $ref: "#/components/schemas/Date" }
        allowed_next:
          type: array
          description: Statuses reachable from the current one (INSPECTED additionally needs housekeeping.inspect).
          items: { $ref: "#/components/schemas/HousekeepingStatus" }
    HousekeepingBoard:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HousekeepingBoardRoom" }
    SetHousekeepingRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/HousekeepingStatus" }
        notes: { type: string, maxLength: 500 }
    HousekeepingState:
      type: object
      required: [room_id, status, updated_at]
      properties:
        room_id: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/HousekeepingStatus" }
        updated_at: { type: string, format: date-time }
    HousekeepingLog:
      type: object
      required: [id, room_id, from_status, to_status, source, business_date, changed_at]
      properties:
        id: { type: integer, format: int64 }
        room_id: { type: integer, format: int64 }
        from_status: { $ref: "#/components/schemas/HousekeepingStatus" }
        to_status: { $ref: "#/components/schemas/HousekeepingStatus" }
        source: { type: string, enum: [MANUAL, CHECK_OUT, ROOM_MOVE, NIGHT_AUDIT, CHECK_IN_REVERSAL] }
        business_date: { $ref: "#/components/schemas/Date" }
        notes: { type: string }
        changed_at: { type: string, format: date-time }
        changed_by: { type: integer, format: int64 }
    HousekeepingLogPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HousekeepingLog" }
        next_cursor: { type: string }
    Guest:
      type: object
      required: [id, code, last_name, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, examples: [GST000001] }
        origin_property_id: { type: integer, format: int64 }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        phone: { type: string }
        nationality: { type: string, description: ISO 3166-1 alpha-2. }
        country_code: { type: string, description: ISO 3166-1 alpha-2. }
        date_of_birth: { $ref: "#/components/schemas/Date" }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, UNDISCLOSED] }
        id_type: { type: string }
        id_number: { type: string }
        address: { type: string }
        city: { type: string }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GuestView:
      allOf:
        - $ref: "#/components/schemas/Guest"
        - type: object
          required: [can_edit]
          properties:
            can_edit: { type: boolean, description: The caller holds guest.write at a property where the guest is linked. }
    GuestPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Guest" }
        next_cursor: { type: string }
    GuestInput:
      type: object
      additionalProperties: false
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 30 }
        nationality: { type: string }
        country_code: { type: string }
        date_of_birth: { type: string, description: "YYYY-MM-DD, between 1900 and today. An empty string clears it on PATCH." }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, UNDISCLOSED] }
        id_type: { type: string, maxLength: 30 }
        id_number: { type: string, maxLength: 50, description: Requires id_type. }
        address: { type: string, maxLength: 300 }
        city: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 2000 }
    CreateGuestRequest:
      type: object
      required: [origin_property_id, last_name]
      additionalProperties: false
      properties:
        origin_property_id: { type: integer, format: int64 }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 30 }
        nationality: { type: string }
        country_code: { type: string }
        date_of_birth: { $ref: "#/components/schemas/Date" }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, UNDISCLOSED] }
        id_type: { type: string, maxLength: 30 }
        id_number: { type: string, maxLength: 50 }
        address: { type: string, maxLength: 300 }
        city: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 2000 }
    PatchGuestRequest:
      $ref: "#/components/schemas/GuestInput"
    PossibleDuplicate:
      type: object
      required: [guest, reasons]
      properties:
        guest: { $ref: "#/components/schemas/Guest" }
        reasons:
          type: array
          items: { type: string, enum: [SAME_EMAIL, SAME_PHONE, SAME_ID_DOCUMENT, SAME_NAME_AND_BIRTH_DATE] }
    CreatedGuest:
      allOf:
        - $ref: "#/components/schemas/Guest"
        - type: object
          required: [possible_duplicates, hidden_duplicate_count]
          properties:
            possible_duplicates:
              type: array
              items: { $ref: "#/components/schemas/PossibleDuplicate" }
            hidden_duplicate_count:
              type: integer
              description: Look-alike profiles the caller may not see.
    GuestHistoryItem:
      type: object
      required: [type, id, number, role, status, property_id, property_code, property_name, arrival_date, departure_date]
      properties:
        type: { type: string, enum: [RESERVATION, STAY] }
        id: { type: integer, format: int64 }
        number: { type: string, description: Confirmation or stay number. }
        role: { type: string, enum: [BOOKER, OCCUPANT, PRIMARY, ACCOMPANYING] }
        status: { type: string }
        property_id: { type: integer, format: int64 }
        property_code: { type: string }
        property_name: { type: string }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
    GuestHistory:
      type: object
      required: [data, hidden_count]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/GuestHistoryItem" }
        next_cursor: { type: string }
        hidden_count: { type: integer, description: Items at properties the caller may not see. }
    Percent:
      type: string
      pattern: '^[0-9]{1,3}(\.[0-9]{1,4})?$'
      description: A percentage from 0 to 100 with at most four decimals. Always returned with four decimals.
      examples: ["11.0000"]
    Amount:
      type: string
      pattern: '^[0-9]{1,15}(\.[0-9]{1,3})?$'
      description: A non-negative decimal amount as a string. It may not have more decimals than the property currency.
      examples: ["250000"]
    ChargeType:
      type: string
      enum: [ROOM, FOOD_BEVERAGE, SERVICE, FEE, OTHER]
    PriceMode:
      type: string
      enum: [EXCLUSIVE, INCLUSIVE]
      description: Whether a price excludes or already contains the mapped service charges and taxes.
    GlAccountCode:
      type: [string, "null"]
      description: |
        An account code of the chart of accounts the accounting module will own (text, never an id), for example `4-1100` or `2.1.05`. Optional until accounting exists; the PMS only checks its shape.
    Tax:
      type: object
      required: [id, code, name, rate, tax_on_service, gl_account_code, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rate: { $ref: "#/components/schemas/Percent" }
        tax_on_service: { type: boolean, description: The tax is also levied on the service charges. }
        gl_account_code: { $ref: "#/components/schemas/GlAccountCode", description: "Tax payable account of the chart of accounts, copied onto the ledger when an item is posted." }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        affected_open_stays:
          type: integer
          description: Only on an update that changed the rate. Open stays that will be charged at the new rate from now on.
    TaxPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Tax" }
        next_cursor: { type: string }
    CreateTaxRequest:
      type: object
      required: [code, name, rate]
      additionalProperties: false
      properties:
        code: { type: string, description: "1-20 characters, A-Z 0-9 - _ (upper-cased)." }
        name: { type: string, maxLength: 100 }
        rate: { $ref: "#/components/schemas/Percent" }
        tax_on_service: { type: boolean, default: false }
        gl_account_code: { type: string, description: "Account code (A-Z 0-9 . - _ : /, at most 30 characters, upper-cased). Optional." }
        is_active: { type: boolean, default: true }
    PatchTaxRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        rate: { $ref: "#/components/schemas/Percent" }
        tax_on_service: { type: boolean }
        gl_account_code: { type: string, description: "An account code, or an empty string to clear it." }
        is_active: { type: boolean }
    ServiceCharge:
      type: object
      required: [id, code, name, rate, gl_account_code, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rate: { $ref: "#/components/schemas/Percent" }
        gl_account_code: { $ref: "#/components/schemas/GlAccountCode", description: "Service charge payable account (optional)." }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        affected_open_stays: { type: integer, description: Only on an update that changed the rate. }
    ServiceChargePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ServiceCharge" }
        next_cursor: { type: string }
    CreateServiceChargeRequest:
      type: object
      required: [code, name, rate]
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string, maxLength: 100 }
        rate: { $ref: "#/components/schemas/Percent" }
        gl_account_code: { type: string, description: "Account code, optional." }
        is_active: { type: boolean, default: true }
    PatchServiceChargeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        rate: { $ref: "#/components/schemas/Percent" }
        is_active: { type: boolean }
    TaxRule:
      type: object
      required: [tax_id, code, name, rate, tax_on_service, sequence]
      properties:
        tax_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rate: { $ref: "#/components/schemas/Percent" }
        tax_on_service: { type: boolean }
        sequence: { type: integer, description: Calculation and display order. }
    ServiceRule:
      type: object
      required: [service_charge_id, code, name, rate, sequence]
      properties:
        service_charge_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rate: { $ref: "#/components/schemas/Percent" }
        sequence: { type: integer }
    ChargeCode:
      type: object
      required: [id, code, name, charge_type, price_mode, gl_account_code, is_system, is_active, taxes, service_charges, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        charge_type: { $ref: "#/components/schemas/ChargeType" }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        default_unit_price: { $ref: "#/components/schemas/Amount" }
        gl_account_code: { $ref: "#/components/schemas/GlAccountCode", description: "Revenue account of this charge (optional). Copied onto the ledger when an item is posted." }
        is_system: { type: boolean }
        is_active: { type: boolean }
        taxes:
          type: array
          description: Active tax rules in calculation order.
          items: { $ref: "#/components/schemas/TaxRule" }
        service_charges:
          type: array
          description: Active service rules in calculation order.
          items: { $ref: "#/components/schemas/ServiceRule" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChargeCodePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ChargeCode" }
        next_cursor: { type: string }
    CreateChargeCodeRequest:
      type: object
      required: [code, name, charge_type, price_mode]
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string, maxLength: 100 }
        charge_type: { $ref: "#/components/schemas/ChargeType" }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        default_unit_price: { $ref: "#/components/schemas/Amount" }
        gl_account_code: { type: string, description: "Revenue account code, optional." }
        is_active: { type: boolean, default: true }
    PatchChargeCodeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        charge_type: { $ref: "#/components/schemas/ChargeType" }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        default_unit_price: { type: string, description: An amount, or an empty string to clear it. }
        gl_account_code: { type: string, description: "An account code, or an empty string to clear it." }
        is_active: { type: boolean }
    ReplaceRulesRequest:
      type: object
      additionalProperties: false
      properties:
        taxes:
          type: array
          maxItems: 20
          items:
            type: object
            required: [tax_id, sequence]
            additionalProperties: false
            properties:
              tax_id: { type: integer, format: int64 }
              sequence: { type: integer, minimum: 1, maximum: 32767 }
        service_charges:
          type: array
          maxItems: 20
          items:
            type: object
            required: [service_charge_id, sequence]
            additionalProperties: false
            properties:
              service_charge_id: { type: integer, format: int64 }
              sequence: { type: integer, minimum: 1, maximum: 32767 }
    SignedAmount:
      type: string
      pattern: '^-?[0-9]{1,16}(\.[0-9]{1,4})?$'
      description: A plain decimal amount as a string, possibly negative. No separators or exponents.
      examples: ["1000000", "-7.05"]
    CalculateChargeRequest:
      type: object
      required: [charge_code_id, quantity, unit_price]
      additionalProperties: false
      properties:
        charge_code_id: { type: integer, format: int64 }
        quantity: { $ref: "#/components/schemas/SignedAmount" }
        unit_price: { $ref: "#/components/schemas/SignedAmount" }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        discount_amount: { $ref: "#/components/schemas/SignedAmount" }
    CalculationComponent:
      type: object
      required: [rule_id, code, name, rate, base_amount, amount, sequence]
      properties:
        rule_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rate: { $ref: "#/components/schemas/Percent" }
        tax_on_service: { type: boolean, description: Taxes only. }
        base_amount: { type: string, description: The amount the rate was applied to. }
        amount: { type: string }
        sequence: { type: integer }
    ChargeCalculation:
      type: object
      required: [price_mode, quantity, unit_price, base_amount, discount_amount, net_amount, rounding_adjustment, service_charges, taxes, service_charge_total, tax_total, taxable_amount, total_amount]
      properties:
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        quantity: { type: string }
        unit_price: { type: string }
        base_amount: { type: string, description: round(quantity x unit price), as quoted. }
        discount_amount: { type: string, description: Signed like base_amount. }
        net_amount: { type: string, description: Net revenue; includes the rounding adjustment. }
        rounding_adjustment: { type: string, description: Always 0 for an exclusive price. }
        service_charges:
          type: array
          items: { $ref: "#/components/schemas/CalculationComponent" }
        taxes:
          type: array
          items: { $ref: "#/components/schemas/CalculationComponent" }
        service_charge_total: { type: string }
        tax_total: { type: string }
        taxable_amount: { type: string, description: The largest tax base (display only). }
        total_amount: { type: string, description: Net + service + tax; equals the quoted price when inclusive. }
    MealPlan:
      type: string
      enum: [RO, BB, HB, FB, AI]
      description: Room only, bed and breakfast, half board, full board, all inclusive. Informational in the MVP.
    RatePlan:
      type: object
      required: [id, code, name, meal_plan, is_refundable, room_charge_code_id, room_charge_code, price_mode, is_active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        meal_plan: { $ref: "#/components/schemas/MealPlan" }
        cancellation_policy: { type: string }
        is_refundable: { type: boolean }
        room_charge_code_id: { type: integer, format: int64 }
        room_charge_code: { type: string, description: Code of the room charge code. }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RatePlanPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RatePlan" }
        next_cursor: { type: string }
    CreateRatePlanRequest:
      type: object
      required: [code, name, meal_plan, room_charge_code_id]
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        meal_plan: { $ref: "#/components/schemas/MealPlan" }
        cancellation_policy: { type: string, maxLength: 2000 }
        is_refundable: { type: boolean, default: true }
        room_charge_code_id: { type: integer, format: int64 }
        is_active: { type: boolean, default: true }
    PatchRatePlanRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        meal_plan: { $ref: "#/components/schemas/MealPlan" }
        cancellation_policy: { type: string, maxLength: 2000 }
        is_refundable: { type: boolean }
        room_charge_code_id: { type: integer, format: int64 }
        is_active: { type: boolean }
    RateCell:
      type: object
      required: [room_type_id, stay_date, amount]
      properties:
        room_type_id: { type: integer, format: int64 }
        stay_date: { $ref: "#/components/schemas/Date" }
        amount: { type: string, description: Formatted with the currency's decimals. }
    RateGrid:
      type: object
      required: [rate_plan_id, price_mode, room_charge_code, from, to, rates]
      properties:
        rate_plan_id: { type: integer, format: int64 }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        room_charge_code: { type: string }
        from: { $ref: "#/components/schemas/Date" }
        to: { $ref: "#/components/schemas/Date" }
        rates:
          type: array
          items: { $ref: "#/components/schemas/RateCell" }
    Weekday:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
    FillRatesRequest:
      type: object
      required: [rate_plan_id, room_type_ids, from, to, amount]
      additionalProperties: false
      properties:
        rate_plan_id: { type: integer, format: int64 }
        room_type_ids: { type: array, minItems: 1, maxItems: 50, items: { type: integer, format: int64 } }
        from: { $ref: "#/components/schemas/Date" }
        to: { $ref: "#/components/schemas/Date", description: Exclusive; after from; at most 730 days after it. }
        weekdays:
          type: array
          description: Only these weekdays; all days when omitted or empty.
          items: { $ref: "#/components/schemas/Weekday" }
        amount: { $ref: "#/components/schemas/Amount" }
    FillRatesResult:
      type: object
      required: [updated_nights, created_nights]
      properties:
        updated_nights: { type: integer, description: Nights written (new or overwritten). }
        created_nights: { type: integer, description: Of those, nights that had no rate before. }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, examples: [ok, ready] }
    Night:
      type: object
      required: [date, sellable, demand, available]
      properties:
        date: { $ref: "#/components/schemas/Date" }
        sellable: { type: integer }
        demand: { type: integer }
        available: { type: integer }
    NightAmount:
      type: object
      required: [date, amount]
      properties:
        date: { $ref: "#/components/schemas/Date" }
        amount: { type: string }
    Estimate:
      type: object
      required: [net, service, tax, total]
      properties:
        net: { type: string }
        service: { type: string }
        tax: { type: string }
        total: { type: string }
    PlanOffer:
      type: object
      required: [id, code, name, price_mode, nightly, missing_nights, estimate]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        price_mode: { $ref: "#/components/schemas/PriceMode" }
        nightly:
          type: array
          items: { $ref: "#/components/schemas/NightAmount" }
        missing_nights: { type: integer, description: Nights without a rate; the plan cannot be booked without overrides when above 0. }
        estimate:
          oneOf:
            - { $ref: "#/components/schemas/Estimate" }
            - { type: "null" }
    TypeOffer:
      type: object
      required: [room_type_id, code, name, fits_occupancy, available_min, per_night, rate_plans]
      properties:
        room_type_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        fits_occupancy: { type: boolean }
        available_min: { type: integer }
        per_night:
          type: array
          items: { $ref: "#/components/schemas/Night" }
        rate_plans:
          type: array
          items: { $ref: "#/components/schemas/PlanOffer" }
    AvailabilitySearch:
      type: object
      required: [nights, room_types]
      properties:
        nights:
          type: array
          items: { $ref: "#/components/schemas/Date" }
        room_types:
          type: array
          items: { $ref: "#/components/schemas/TypeOffer" }
    FreeRoom:
      type: object
      required: [room_id, room_number, housekeeping_status]
      properties:
        room_id: { type: integer, format: int64 }
        room_number: { type: string }
        floor: { type: string }
        building: { type: string }
        housekeeping_status: { type: string }
    NightOverride:
      type: object
      required: [date, amount]
      additionalProperties: false
      properties:
        date: { $ref: "#/components/schemas/Date" }
        amount: { type: string, description: The agreed price of the night, at most the currency's decimals. }
        discount_amount: { type: string }
    RoomInput:
      type: object
      required: [room_type_id, rate_plan_id, arrival_date, departure_date, adult_count]
      properties:
        room_type_id: { type: integer, format: int64 }
        rate_plan_id: { type: integer, format: int64 }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
        adult_count: { type: integer, minimum: 1 }
        child_count: { type: integer, minimum: 0, default: 0 }
        guest_id: { type: integer, format: int64, description: The occupant, when different from the booker. }
        room_id: { type: integer, format: int64, description: Only with confirm; must be a room of the booked type. }
        nightly_overrides:
          type: array
          items: { $ref: "#/components/schemas/NightOverride" }
    CreateReservationRequest:
      type: object
      required: [source, rooms]
      additionalProperties: false
      properties:
        guest_id: { type: integer, format: int64, description: The booker; required when confirming. }
        source: { $ref: "#/components/schemas/ReservationSource" }
        market: { type: string }
        special_request: { type: string }
        remarks: { type: string }
        company_id: { type: [integer, "null"], format: int64, description: The company that is billed; a group's company is inherited. }
        booking_group_id: { type: [integer, "null"], format: int64, description: The group; the stays must lie within its dates (422 `OUTSIDE_GROUP_DATES` on the room), the group must be active (409 `GROUP_INACTIVE`). }
        confirm: { type: boolean, default: false }
        rooms:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/RoomInput" }
    ReservationSource:
      type: string
      enum: [WALK_IN, PHONE, EMAIL, WEBSITE, OTA, AGENT, OTHER]
    PatchReservationRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32 }
        guest_id: { type: integer, format: int64 }
        source: { $ref: "#/components/schemas/ReservationSource" }
        market: { type: string }
        special_request: { type: string }
        remarks: { type: string }
        company_id: { type: integer, format: int64, description: Below 1 clears the company. }
        booking_group_id: { type: integer, format: int64, description: Below 1 clears the group. }
    VersionRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32 }
    ReasonRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32 }
        reason: { type: string, maxLength: 500, description: Required to cancel; optional for a no-show. }
    AddRoomRequest:
      allOf:
        - $ref: "#/components/schemas/RoomInput"
        - type: object
          required: [version]
          properties:
            version: { type: integer, format: int32 }
    PatchReservationRoomRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32 }
        arrival_date: { $ref: "#/components/schemas/Date" }
        departure_date: { $ref: "#/components/schemas/Date" }
        room_type_id: { type: integer, format: int64 }
        rate_plan_id: { type: integer, format: int64 }
        adult_count: { type: integer, minimum: 1 }
        child_count: { type: integer, minimum: 0 }
        nightly_overrides:
          type: array
          items: { $ref: "#/components/schemas/NightOverride" }
    AssignRoomRequest:
      type: object
      required: [version, room_id]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32 }
        room_id: { type: integer, format: int64 }
        upgrade: { type: boolean, default: false }
    GuestName:
      type: object
      required: [id, code, last_name]
      properties:
