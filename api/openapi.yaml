      operationId: listBankStatements
      summary: Imported bank statements, newest first (bank.view)
      tags: [bank]
      parameters:
        - { name: bank_account_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, RECONCILED] } }
      responses:
