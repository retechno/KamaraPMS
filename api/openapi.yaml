      - $ref: "#/components/parameters/Id"
    get:
      operationId: getGeneralLedger
      summary: General ledger of one account (accounting.view)
      description: "The entries of the account in the range with a running balance on the account's normal side (a credit account shows credit balances as positive). At most 5000 lines (`truncated`)."
      tags: [accounting]
      parameters:
        - { name: from, in: query, description: Start of the range; the first day of the current business month by default., schema: { type: string, format: date } }
        - { name: to, in: query, description: End of the range (included); the current business date by default., schema: { type: string, format: date } }
        - { name: format, in: query, description: "`csv` answers the report as a CSV file.", schema: { type: string, enum: [csv, json] } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralLedger" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/income-statement:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getIncomeStatement
      summary: Income statement after USALI (accounting.view)
      description: "Operating revenue by department, departmental expenses and profit, undistributed expenses, gross operating profit (GOP), management fees, non-operating expenses (EBITDA), depreciation, interest and income taxes down to net income. Lines of kind GROUP list their accounts; HEADING, SUBTOTAL and TOTAL are structure and results."
      tags: [accounting]
      parameters:
        - { name: from, in: query, description: Start of the range; the first day of the current business month by default., schema: { type: string, format: date } }
        - { name: to, in: query, description: End of the range (included); the current business date by default., schema: { type: string, format: date } }
        - { name: format, in: query, description: "`csv` answers the report as a CSV file.", schema: { type: string, enum: [csv, json] } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeStatement" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/balance-sheet:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getBalanceSheet
      summary: Balance sheet (accounting.view)
      description: "Assets, liabilities and equity as of a business date. Equity includes the earnings of all periods to date (there is no year-end closing entry). `difference` is zero when the books balance."
      tags: [accounting]
      parameters:
        - { name: as_of, in: query, description: The business date; the current business date by default., schema: { type: string, format: date } }
        - { name: format, in: query, description: "`csv` answers the report as a CSV file.", schema: { type: string, enum: [csv, json] } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceSheet" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/properties/{propertyId}/accounting/reconciliation:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      operationId: getReconciliation
      summary: Control accounts against the folios (accounting.view)
      description: "The guest ledger, advance deposits and city ledger accounts compared with what the folios and the city ledger say as of a date. Closed days without a journal (`pending_days`) and the open business day (`includes_open_day`) make the ledger fall behind. `reconciled` is true when nothing is pending and every difference is zero."
      tags: [accounting]
      parameters:
        - { name: as_of, in: query, description: The business date; the current business date by default., schema: { type: string, format: date } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reconciliation" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
