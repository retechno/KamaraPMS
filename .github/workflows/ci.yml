name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go (lint, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      # The print agent is one program for two systems: it must build for both (it has no cgo; the Windows spooler is called through x/sys/windows).
      - name: Print agent builds for Windows and Linux
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/pos-agent
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/pos-agent
          GOOS=windows GOARCH=amd64 go vet ./cmd/pos-agent ./internal/posagent
      - name: sqlc generated code is up to date with the queries
        run: scripts/sqlc.sh diff
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      # Database tests start PostgreSQL with testcontainers (Docker is available on ubuntu runners).
      - name: Test (race detector)
        run: go test -race -count=1 ./...

  schema:
    name: Schema (migrations up/down/up + integrity tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["postgres:16-alpine", "postgres:18-alpine"]
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and schema tests
        run: scripts/db-test.sh
        env:
          PG_IMAGE: ${{ matrix.postgres }}

  web:
    name: Web (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date with api/openapi.yaml
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright, every module and the night audit)
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: pms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pms -d pms" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PMS_E2E_DATABASE_URL: postgres://pms:pms@localhost:5432/pms_e2e?sslmode=disable
      PMS_JWT_SECRET: ci-e2e-secret-0123456789abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Type check of the e2e tests
        run: npm run e2e:types
        working-directory: web
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: E2E (scripts/e2e.sh resets pms_e2e, builds bin/e2e, runs playwright)
        run: bash scripts/e2e.sh
      - name: Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
