# TLS on the proxy itself. Use it together with the main file:
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.tls.yaml up -d --build
#
# The proxy then serves https on 8443 (published as PMS_PUBLIC_TLS_PORT) and sends http on 8080 to https. The certificate and the key are two files you provide, as
# deploy/certs/tls.crt and deploy/certs/tls.key (a certificate from your authority, or a self-signed one for a trial: deploy/make-dev-cert.sh). Nothing is requested or
# renewed by the stack, and no domain name is written in it. docs/deployment.md, "TLS strategy", describes the options.

services:
  proxy:
    ports: !override
      - "${PMS_BIND:-127.0.0.1}:${PMS_PUBLIC_PORT:-8080}:8080"
      - "${PMS_BIND:-127.0.0.1}:${PMS_PUBLIC_TLS_PORT:-8443}:8443"
    volumes:
      - ./nginx/tls.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
