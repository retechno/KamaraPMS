# Headers of every answer that serves the page or the API. Included in each location that adds headers of its own, because nginx does not inherit add_header
# into a location that has an add_header.
#
# Content-Security-Policy: the page and the API are one origin and nothing is loaded from elsewhere (no CDN, no font service, no analytics). Styles need 'unsafe-inline'
# because the interface sets style attributes; scripts do not. PDF and CSV downloads are blob: URLs made by the page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
