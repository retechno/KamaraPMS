# How a request reaches the Go API.
#
# X-Forwarded-For is OVERWRITTEN with the address of the peer of this connection, never appended to what the client sent: this proxy is the edge, so whatever the client wrote
# in that header is untrusted and is dropped here. The API believes the header only from the addresses in PMS_TRUSTED_PROXIES (the address of this proxy).
# If another proxy or a load balancer stands in front of this one, trust it with set_real_ip_from and real_ip_header (see docs/deployment.md) and keep this line.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";

# The security headers are set once, here, so an answer does not carry two values of one header: the ones the API adds when it is reached directly are dropped.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;

# Timeouts: the API itself gives up on a request after 60 s (its write timeout), so the proxy waits a little longer and never less.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 70s;
# A PDF or a report can be large: stream it, do not buffer it to disk.
proxy_buffering on;
proxy_request_buffering on;
proxy_redirect off;
